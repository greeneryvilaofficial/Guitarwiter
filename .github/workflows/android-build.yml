name: Build Android APK

on:
  push:
    branches: [ main ]
    # Push tag versi (mis. "v1.0.0") buat memicu APK diberi nama resmi DAN
    # otomatis dipublikasikan ke halaman "Releases" repo ini.
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # WAJIB "write" -- tanpa ini step "Buat GitHub Release resmi" di bawah
    # akan gagal (403) karena GITHUB_TOKEN bawaan cuma baca.
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependency npm
        run: npm install

      - name: Cek isi folder www/ sebelum lanjut
        run: |
          set -e
          echo "Isi folder www/:"
          ls -la www/ || (echo "FATAL: folder www/ tidak ditemukan di root repo" && exit 1)
          test -f www/index.html || (echo "FATAL: www/index.html tidak ada" && exit 1)
          echo "OK: www/ lengkap"

      - name: Buat folder android/ (verbose, berhenti kalau gagal)
        run: |
          set -e -x
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Folder android/ sudah ada, lewati."
          fi

      - name: Sync isi www/ ke android/ (verbose, berhenti kalau gagal)
        run: |
          set -e -x
          npx cap sync android

      - name: WAJIB - pastikan android/app/build.gradle benar-benar ada
        run: |
          set -e
          if [ ! -f "android/app/build.gradle" ]; then
            echo "FATAL: android/app/build.gradle tidak ditemukan setelah cap add + cap sync."
            echo "Menampilkan seluruh struktur folder android/ untuk diagnosa:"
            find android -maxdepth 5 2>/dev/null || echo "Folder android/ bahkan tidak ada sama sekali."
            exit 1
          fi
          echo "OK: android/app/build.gradle ditemukan."

      - name: Tempel HtmlKeyboardService.java ke lokasi paket Java
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/keyboardkustom/app
          cp native-patches/HtmlKeyboardService.java android/app/src/main/java/com/keyboardkustom/app/HtmlKeyboardService.java

      - name: Tempel NativeMicPitchDetector.java (deteksi nada native, ganti getUserMedia)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/keyboardkustom/app
          cp native-patches/NativeMicPitchDetector.java android/app/src/main/java/com/keyboardkustom/app/NativeMicPitchDetector.java

      - name: Tempel MainActivity.java (versi yang minta izin mikrofon)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/keyboardkustom/app
          cp native-patches/MainActivity.java android/app/src/main/java/com/keyboardkustom/app/MainActivity.java

      - name: Tempel method.xml ke folder res/xml
        run: |
          set -e
          mkdir -p android/app/src/main/res/xml
          cp native-patches/method.xml android/app/src/main/res/xml/method.xml

      - name: Daftarkan service keyboard di AndroidManifest.xml
        run: python3 native-patches/insert_service.py android/app/src/main/AndroidManifest.xml

      - name: Tambahkan izin RECORD_AUDIO di AndroidManifest.xml
        run: python3 native-patches/insert_permission.py android/app/src/main/AndroidManifest.xml

      - name: Tambahkan dependency androidx.webkit (untuk WebViewAssetLoader/mikrofon)
        run: python3 native-patches/insert_webkit_dependency.py android/app/build.gradle

      - name: Decode keystore dari secret (kalau ada)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || (echo "FATAL: release.keystore kosong/gagal decode" && exit 1)

      - name: Tambahkan signing config ke build.gradle (kalau keystore tersedia)
        if: env.KEYSTORE_BASE64 != ''
        run: python3 native-patches/insert_signing.py android/app/build.gradle

      - name: Beri izin eksekusi gradlew
        run: chmod +x android/gradlew

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Tentukan nama & versi resmi APK
        id: apkname
        run: |
          set -e
          # Nama app buat penamaan file -- ganti di sini kalau mau nama lain.
          APP_NAME="GenjrengKetik"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Push tag "v1.2.0" -> versi resmi "1.2.0"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Build biasa (bukan dari tag) -> ditandai jelas sebagai versi dev,
            # bukan versi resmi, pakai potongan commit hash.
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nama resmi APK: ${APP_NAME}-${VERSION}-*.apk"

      - name: Ganti nama APK debug jadi nama resmi
        if: always()
        run: |
          set -e
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="$SRC"
          if [ -f "$SRC" ]; then
            DEST="android/app/build/outputs/apk/debug/${{ steps.apkname.outputs.app_name }}-${{ steps.apkname.outputs.version }}-debug.apk"
            cp "$SRC" "$DEST"
          fi
          echo "DEBUG_APK_PATH=$DEST" >> "$GITHUB_ENV"

      - name: Unggah APK debug sebagai artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apkname.outputs.app_name }}-${{ steps.apkname.outputs.version }}-debug
          path: ${{ env.DEBUG_APK_PATH }}
          if-no-files-found: ignore

      - name: Build APK release (signed)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Ganti nama APK release jadi nama resmi
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          DEST="$SRC"
          if [ -f "$SRC" ]; then
            DEST="android/app/build/outputs/apk/release/${{ steps.apkname.outputs.app_name }}-${{ steps.apkname.outputs.version }}-release.apk"
            cp "$SRC" "$DEST"
          fi
          echo "RELEASE_APK_PATH=$DEST" >> "$GITHUB_ENV"

      - name: Unggah APK release sebagai artifact (kalau ada)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apkname.outputs.app_name }}-${{ steps.apkname.outputs.version }}-release
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: ignore

      - name: Buat GitHub Release resmi (cuma kalau push tag versi, mis. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.apkname.outputs.app_name }} ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: ${{ env.RELEASE_APK_PATH }}
          generate_release_notes: true
