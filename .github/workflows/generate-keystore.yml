name: Generate Release Keystore (jalankan sekali saja)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Buat keystore baru
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias genjreng \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fahricoustic123 \
            -keypass fahricoustic123 \
            -dname "CN=Genjreng Ketik, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=ID"

      - name: Ubah keystore ke teks base64
        run: base64 -w 0 release.keystore > release.keystore.base64.txt

      - name: Unggah keystore & versi base64-nya sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            release.keystore
            release.keystore.base64.txt
