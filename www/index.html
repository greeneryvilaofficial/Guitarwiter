<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Guitar Witer — Nada Gitar Jadi Ketikan Otomatis</title>
<meta name="description" content="Petik nada di gitar aslimu — mikrofon mendeteksinya secara real-time dan huruf yang sesuai otomatis terketik. Keyboard virtual bergaya Google Keyboard lengkap dengan Shift, mode simbol, emoji, dan mode mengambang.">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1A73E8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guitar Witer">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:type" content="website">
<meta property="og:title" content="Guitar Witer — Nada Gitar Jadi Ketikan Otomatis">
<meta property="og:description" content="Petik nada di gitar aslimu, dan huruf yang sesuai otomatis terketik lewat keyboard virtual bergaya Google Keyboard.">
<meta property="og:image" content="icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Guitar Witer">
<meta name="twitter:description" content="Nada gitar jadi ketikan otomatis, langsung di browser.">
<meta name="twitter:image" content="icon-512.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

  :root{
    --app-bg:#F1F3F4;
    --frame:#1F2023;
    --screen:#FFFFFF;
    --field-bg:#FFFFFF;
    --field-border:#DADCE0;
    --kb-bg:#202124;
    --key-bg:#35363A;
    --key-fn-bg:#28292C;
    --key-text:#E8EAED;
    --key-tag:#7CE7C4;
    --shadow:rgba(0,0,0,.45);
    --accent:#1A73E8;
    --accent-dim:#E8F0FE;
    --danger:#D93025;
    --muted:#5F6368;
    --key-shift-on-bg:#284666;
    --key-capslock-bg:#1A73E8;
    --key-active-bg:#2E5D4D;
    --key-fn-active-bg:#3A4A57;
    --key-bubble-bg:#101114;
    --key-bubble-text:#FFFFFF;
    --key-enter-bg:#1CC9A5;
    /* ---- Rasio ukuran huruf tuts, bisa diubah 0.85–2.0 lewat Setelan (85%–200%), persis fitur Gboard terbaru ---- */
    --key-font-scale:1;
    /* ---- Gaya Material 3 Expressive: tuts berbentuk membulat (pill/stadium),
       bukan kotak siku seperti keyboard lama. Batas tuts (outline) opsional,
       default polos menyatu dengan background, bisa dinyalakan lewat Setelan. ---- */
    --key-radius:20px;
    --key-border:none;
  }
  /* ---- Tema alternatif ala Gboard: tinggal ganti class di <body> ---- */
  body.theme-light{
    --kb-bg:#E8EAED; --key-bg:#FFFFFF; --key-fn-bg:#DADCE0; --key-text:#202124;
    --key-tag:#1A73E8; --key-active-bg:#C2E7FF; --key-fn-active-bg:#BDC1C6;
    --key-bubble-bg:#202124; --key-bubble-text:#FFFFFF; --key-enter-bg:#1A73E8;
  }
  body.theme-blue{
    --kb-bg:#0B2545; --key-bg:#13315C; --key-fn-bg:#0E223F; --key-text:#E8F0FE;
    --key-tag:#8AB4F8; --key-active-bg:#1A4A8A; --key-fn-active-bg:#1A4A8A;
    --key-bubble-bg:#08182E; --key-bubble-text:#FFFFFF; --key-enter-bg:#4C8DFF;
  }
  body.theme-purple{
    --kb-bg:#241B2F; --key-bg:#3A2C4A; --key-fn-bg:#2B2038; --key-text:#F1E8FA;
    --key-tag:#D9B3FF; --key-active-bg:#5B3E75; --key-fn-active-bg:#4A3560;
    --key-bubble-bg:#1A1220; --key-bubble-text:#FFFFFF; --key-enter-bg:#B388FF;
  }
  body.theme-green{
    --kb-bg:#0F2A1E; --key-bg:#17402C; --key-fn-bg:#0F2A1E; --key-text:#E4F5EA;
    --key-tag:#7CE7C4; --key-active-bg:#1F6B47; --key-fn-active-bg:#1B5A3D;
    --key-bubble-bg:#081A11; --key-bubble-text:#FFFFFF; --key-enter-bg:#2ECC8F;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    background:var(--kb-bg);
    font-family:'Roboto', sans-serif;
    color:var(--key-text);
    overflow-x:hidden;
  }

  /* Halaman ini murni tampilan keyboard saja (tanpa contoh kotak teks /
     judul aplikasi) — dibuat supaya saat dimuat sebagai keyboard sungguhan
     lewat HtmlKeyboardService.java, yang tampil cuma keyboard-nya, mengisi
     penuh area yang diberikan Android untuk keyboard. */
  .kb-float-wrap{
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:var(--kb-bg);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }

  /* ---- Responsif: layar sangat sempit / lebih lebar (tablet) ---- */
  @media (max-width:340px){
    .krow{ gap:3px; margin-bottom:4px; }
    .key{ padding:7px 0 5px; }
    .key .ch{ font-size:.9rem; }
  }
  @media (min-width:600px){
    .kb-float-wrap{ max-width:600px; }
    .key .ch{ font-size:1.15rem; }
  }

  .gboard-toolbar{
    display:flex; align-items:center; justify-content:flex-start;
    /* Tinggi toolbar fitur mengikuti rasio Gboard asli: ~10–12% dari total tinggi
       keyboard. Nilai pastinya (--toolbar-h) dihitung & di-set oleh JS lewat
       ResizeObserver di kbWrap (lihat sizeToolbarToRatio()), clamp() di sini
       cuma jaring pengaman sebelum JS sempat jalan / kalau JS gagal. */
    min-height:var(--toolbar-h, clamp(44px, 11vh, 56px));
    padding:6px 6px; gap:2px;
    overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
  }
  .gboard-toolbar::-webkit-scrollbar{ display:none; }
  .gtool-btn{
    border:none; background:none; color:#9AA0A6; font-size:1.25rem;
    /* Area sentuh 48dp x 48dp sesuai standar Material Design (accessibility target minimum),
       supaya mic/menu/setelan tidak mudah salah tekan. */
    width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent; flex:0 0 auto;
    transition:background .1s ease;
  }
  .gtool-btn:active{ background:rgba(255,255,255,.12); }
  .gtool-btn#gifBtn, .gtool-btn#translateBtn{
    width:auto; min-width:48px; padding:0 10px; font-size:.72rem; font-weight:700;
    letter-spacing:.02em; border-radius:18px; background:rgba(255,255,255,.06);
  }
  .gtool-btn.tool-active{ color:var(--key-tag); background:rgba(124,231,196,.14); }
  .gtool-btn.mic-tool{ color:#8AB4F8; }
  .gtool-btn.mic-tool.on{ color:#F28B82; }
  .gtool-spacer{ flex:1; }

  .keyboard{ background:var(--kb-bg); border-radius:14px 14px 0 0; margin-top:0; padding:4px 4px 6px; }
  .krow{ display:flex; gap:4px; justify-content:center; margin-bottom:6px; }
  .krow:last-child{ margin-bottom:0; }
  /* Offset tiap baris dikit-dikit biar diamond-shape kayak QWERTY fisik/Gboard asli */
  .krow:nth-child(2){ padding:0 1.6%; }
  .krow:nth-child(3){ padding:0 4.4%; }
  .krow:nth-child(4){ padding:0 0; }

  .key{
    position:relative; flex:1; min-width:0; background:var(--key-bg);
    border:var(--key-border); border-radius:var(--key-radius);
    padding:12px 0 9px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 1.5px 0 var(--shadow); font-family:'Roboto', sans-serif;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    min-height:44px; transition:border-radius .12s ease;
  }
  .key .ch{ font-size:calc(1.05rem * var(--key-font-scale)); font-weight:400; color:var(--key-text); line-height:1; }
  .key .tag{ font-size:.48rem; font-weight:700; color:var(--key-tag); margin-top:3px; }
  .key.fn{ background:var(--key-fn-bg); flex:1.3; }
  .key.fn .ch{ font-size:calc(.85rem * var(--key-font-scale)); color:#C6C9CD; }
  /* Shift & Backspace: rasio lebar 1.5x tuts huruf biasa, sama-sama, biar gampang
     dijangkau kelingking/jempol saat mengetik cepat (persis spesifikasi Gboard). */
  .key.fn.key-shift, .key.fn.key-backspace{ flex:1.5; }
  .key.fn.key-shift .ch{ font-size:calc(1.15rem * var(--key-font-scale)); }
  /* Spacebar: porsi ~50% dari lebar baris bawah (baris: emoji, ?123, koma, spasi, titik, enter) */
  .key.space{ flex:6.3; padding-top:14px; padding-bottom:11px; }
  .key.space .ch{ font-size:calc(.66rem * var(--key-font-scale)); color:#C6C9CD; font-weight:500; letter-spacing:.04em; }
  .key.is-active{ background:var(--key-active-bg); }
  .key.fn.is-active{ background:var(--key-fn-active-bg); }
  .key.shift-on{ background:var(--key-shift-on-bg); }
  .key.caps-lock{ background:var(--key-capslock-bg); }
  .key.caps-lock .ch{ color:#fff; }
  /* Enter: warna aksen kontras (hijau toska) + bentuk oval/pill supaya jelas ini
     tombol aksi utama (primary action button), bukan sekadar tuts biasa. */
  .key.fn.key-enter{ background:var(--key-enter-bg); flex:1.6; border-radius:22px; }
  .key.fn.key-enter .ch{ color:#062B22; font-size:calc(1.05rem * var(--key-font-scale)); }
  .key.fn.key-enter .tag{ color:#0B3B30; }
  .key.fn.key-enter.is-active{ background:#17AE8D; }

  .emoji-panel{
    display:none;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    background:var(--kb-bg);
    border-radius:14px;
    margin-top:12px;
    padding:10px 6px;
    max-height:230px;
    overflow-y:auto;
  }
  .emoji-btn{
    position:relative; border:var(--key-border); background:var(--key-bg); border-radius:14px;
    padding:7px 0 5px; cursor:pointer; box-shadow:0 1.5px 0 var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .emoji-btn .ch{ font-size:1.1rem; line-height:1; }
  .emoji-btn .tag{ font-size:.42rem; font-weight:700; color:var(--key-tag); }
  .keyboard, .emoji-panel{ contain: layout style paint; }
  .key, .emoji-btn{ touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .emoji-btn.is-active{ background:var(--key-active-bg); }
  .emoji-back-btn{ background:var(--key-active-bg); font-weight:700; }

  /* ---- Suggestion bar (prediksi kata) ---- */
  .suggest-bar{
    display:flex; gap:4px; padding:6px 8px; background:var(--kb-bg);
    border-bottom:1px solid rgba(255,255,255,.06); min-height:34px;
  }
  .suggest-chip{
    flex:1; background:none; border:none; color:var(--key-text);
    font-family:inherit; font-size:.85rem; padding:6px 4px; border-radius:6px;
    text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .suggest-chip:active{ background:rgba(255,255,255,.1); }
  .ime-status{
    display:none; padding:6px 10px; font-size:.78rem; text-align:center;
    background:#B3261E; color:#FFFFFF; font-family:'Roboto', sans-serif;
  }
  .ime-status.show{ display:block; }
  .ime-status.ok{ background:#1F6B47; }

  /* ---- Panel Settings (tema) ---- */
  .settings-panel{
    display:none; padding:14px 12px; background:var(--kb-bg); color:var(--key-text);
    font-family:'Roboto', sans-serif;
  }
  .settings-panel h4{ margin:0 0 10px; font-size:.85rem; color:var(--key-tag); }
  .theme-swatches{ display:flex; gap:12px; flex-wrap:wrap; }
  .theme-swatch{
    width:44px; height:44px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1rem;
  }
  .theme-swatch.selected{ border-color:var(--key-tag); }
  .theme-swatch[data-theme="dark"]{ background:#202124; }
  .theme-swatch[data-theme="light"]{ background:#FFFFFF; }
  .theme-swatch[data-theme="blue"]{ background:#13315C; }
  .theme-swatch[data-theme="purple"]{ background:#3A2C4A; }
  .theme-swatch[data-theme="auto"]{ background:linear-gradient(135deg, #FFFFFF 50%, #202124 50%); color:#5F6368; }
  .theme-swatch[data-theme="green"]{ background:#17402C; }
  .font-scale-row{ display:flex; align-items:center; gap:10px; }
  .font-scale-row input[type="range"]{ flex:1; accent-color:var(--key-tag); height:24px; }
  .font-scale-row span{ font-size:.8rem; font-weight:700; color:var(--key-text); min-width:38px; text-align:right; }
  .key-border-row{ display:flex; align-items:center; gap:10px; font-size:.82rem; color:var(--key-text); cursor:pointer; }
  .key-border-row input[type="checkbox"]{ width:20px; height:20px; accent-color:var(--key-tag); }

  /* ---- Panel Clipboard ---- */
  .clipboard-panel{
    display:none; flex-direction:column; gap:6px; padding:8px;
    background:var(--kb-bg); max-height:260px; overflow-y:auto;
  }
  .clipboard-item{
    background:var(--key-bg); color:var(--key-text); border:none; border-radius:8px;
    padding:10px 12px; text-align:left; font-family:inherit; font-size:.85rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .clipboard-item:active{ background:var(--key-active-bg); }
  .clipboard-empty{ color:var(--muted); font-size:.8rem; padding:10px 4px; }

  /* ---- Mode satu tangan ---- */
  .kb-float-wrap.one-left .keyboard-inner,
  .kb-float-wrap.one-right .keyboard-inner{ transform-origin:bottom left; transform:scale(.78); }
  .kb-float-wrap.one-right .keyboard-inner{ transform-origin:bottom right; margin-left:auto; }
  .one-hand-flip{
    display:none; position:absolute; bottom:8px; width:40px; height:40px; border-radius:50%;
    background:var(--key-fn-bg); color:var(--key-text); border:none; font-size:1.1rem;
  }
  .kb-float-wrap.one-left .one-hand-flip{ display:block; right:6px; }
  .kb-float-wrap.one-right .one-hand-flip{ display:block; left:6px; }

  .key .bubble, .emoji-btn .bubble{
    position:absolute; bottom:100%; left:50%;
    transform:translateX(-50%) translateY(6px) scale(.85);
    background:var(--key-bubble-bg); color:var(--key-bubble-text); font-weight:700; font-size:1.1rem;
    padding:8px 12px; border-radius:8px; box-shadow:0 6px 16px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; white-space:nowrap;
    transition:opacity .1s ease, transform .1s ease; z-index:5;
  }
  .key .bubble.show, .emoji-btn .bubble.show{ opacity:1; transform:translateX(-50%) translateY(-4px) scale(1); }

  /* ---- Panel GIF (placeholder stiker — lihat catatan di JS soal integrasi Tenor asli) ---- */
  .gif-panel{
    display:none; flex-wrap:wrap; gap:6px; padding:10px 8px;
    background:var(--kb-bg); max-height:230px; overflow-y:auto;
  }
  .gif-item{
    flex:0 0 calc(33.333% - 4px); aspect-ratio:1.3/1; border:none; border-radius:10px;
    background:var(--key-bg); color:var(--key-text); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; font-size:1.6rem;
    box-shadow:0 1.5px 0 var(--shadow); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .gif-item .gif-label{ font-size:.55rem; font-weight:700; color:var(--muted); }
  .gif-item:active{ background:var(--key-active-bg); }

  /* ---- Panel Mode Terjemah ---- */
  .translate-panel{
    display:none; flex-direction:column; gap:8px; padding:10px 10px 12px;
    background:var(--kb-bg); color:var(--key-text); font-family:'Roboto', sans-serif;
  }
  .translate-bar{ display:flex; align-items:center; gap:8px; }
  .translate-lang{
    flex:1; background:var(--key-bg); color:var(--key-text); border:none; border-radius:8px;
    padding:8px 6px; font-family:inherit; font-size:.82rem;
  }
  .translate-swap{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:none;
    background:var(--key-fn-bg); color:var(--key-text); font-size:1rem;
  }
  .translate-preview{
    background:var(--key-bg); border-radius:8px; padding:10px; font-size:.9rem;
    min-height:44px; color:var(--key-text); line-height:1.35;
  }
  .translate-insert{
    background:var(--key-enter-bg); color:#062B22; border:none; border-radius:8px;
    padding:9px; font-weight:700; font-size:.85rem; font-family:inherit;
  }
  .translate-note{ font-size:.66rem; color:var(--muted); line-height:1.4; }

  /* ---- Badge angka pojok di baris q-p (mirip hint long-press angka di Gboard) ----
     Ukuran ~30% dari ukuran huruf utama (1.05rem * .3 ≈ .315rem), sesuai rasio
     sub-teks angka di Gboard asli, dan tetap ikut skala --key-font-scale. */
  .key .corner-num{
    position:absolute; top:2px; right:3px;
    font-size:calc(1.05rem * var(--key-font-scale) * .3);
    font-weight:700; color:var(--muted); opacity:.85; line-height:1;
  }
  /* ---- Baris angka: tersembunyi di mode huruf (persis Gboard), cuma tampil di mode ?123 ---- */
  .krow-nums{ display:none; }
  .keyboard.show-num-row .krow-nums{ display:flex; }
  /* ---- Highlight sesaat saat tuts sedang ditekan-tahan buat ambil angka pojok ---- */
  .key.key-longpress-num{ background:var(--key-active-bg); }
  .key.key-longpress-num .ch{ opacity:.35; }
  .key.key-longpress-num .corner-num{ opacity:1; font-size:.85rem; color:var(--key-tag); transition:font-size .08s ease; }

  /* ---- Clipboard: tombol hapus per item + hapus semua ---- */
  .clipboard-toolbar{ display:flex; justify-content:flex-end; padding:0 4px 4px; }
  .clipboard-clear{
    background:none; border:none; color:var(--muted); font-size:.72rem; font-weight:700;
    padding:4px 6px; cursor:pointer;
  }
  .clipboard-item-row{ display:flex; align-items:stretch; gap:4px; }
  .clipboard-item-row .clipboard-item{ flex:1; }
  .clipboard-item-del{
    flex:0 0 34px; background:var(--key-fn-bg); color:var(--muted); border:none;
    border-radius:8px; font-size:.85rem; cursor:pointer;
  }


</style>
</head>
<body>

<div class="kb-float-wrap" id="kbWrap">
  <div class="gboard-toolbar" id="gboardToolbar">
    <button class="gtool-btn" id="clipboardBtn" type="button" title="Clipboard">📋</button>
    <button class="gtool-btn" id="gifBtn" type="button" title="GIF">GIF</button>
    <button class="gtool-btn" id="translateBtn" type="button" title="Terjemahkan">文A</button>
    <button class="gtool-btn" id="oneHandBtn" type="button" title="Mode satu tangan">✋</button>
    <div class="gtool-spacer"></div>
    <button class="gtool-btn" id="settingsBtn" type="button" title="Setelan">⚙</button>
    <button class="gtool-btn mic-tool" id="micToolBtn" type="button" title="Dengarkan gitar (otomatis aktif)">🎤</button>
  </div>
  <div class="suggest-bar" id="suggestBar"></div>
  <div class="ime-status" id="imeStatus"></div>
  <div class="settings-panel" id="settingsPanel">
    <h4>Pilih Tema Warna</h4>
    <div class="theme-swatches" id="themeSwatches">
      <div class="theme-swatch" data-theme="auto" title="Otomatis (ikuti sistem)">◐</div>
      <div class="theme-swatch" data-theme="dark" title="Gelap"></div>
      <div class="theme-swatch" data-theme="light" title="Terang">🔆</div>
      <div class="theme-swatch" data-theme="blue" title="Biru"></div>
      <div class="theme-swatch" data-theme="purple" title="Ungu"></div>
      <div class="theme-swatch" data-theme="green" title="Hijau"></div>
    </div>
    <h4 style="margin-top:16px;">Ukuran Huruf Tuts</h4>
    <div class="font-scale-row">
      <input type="range" id="fontScaleRange" min="85" max="200" step="1" value="100">
      <span id="fontScaleLabel">100%</span>
    </div>
    <h4 style="margin-top:16px;">Batas Tuts</h4>
    <label class="key-border-row">
      <input type="checkbox" id="keyBorderToggle">
      <span>Tampilkan garis batas di setiap tuts</span>
    </label>
  </div>
  <div class="clipboard-panel" id="clipboardPanel"></div>
  <div class="gif-panel" id="gifPanel"></div>
  <div class="translate-panel" id="translatePanel">
    <div class="translate-bar">
      <select class="translate-lang" id="translateFrom">
        <option value="id">Indonesia</option>
        <option value="en">Inggris</option>
      </select>
      <button class="translate-swap" id="translateSwap" type="button" title="Tukar bahasa">⇄</button>
      <select class="translate-lang" id="translateTo">
        <option value="en">Inggris</option>
        <option value="id">Indonesia</option>
      </select>
    </div>
    <div class="translate-preview" id="translatePreview">Ketik pakai tuts di bawah, hasil terjemahan muncul di sini…</div>
    <button class="translate-insert" id="translateInsert" type="button">Sisipkan terjemahan ⏎</button>
    <div class="translate-note">Kamus bawaan terbatas (offline, kata per kata). Untuk hasil akurat penuh, sambungkan API terjemahan (mis. Google Cloud Translation) lewat jembatan Android.</div>
  </div>
  <div class="keyboard-inner" id="keyboardInner">
    <div class="keyboard" id="keyboard"></div>
    <div class="emoji-panel" id="emojiPanel"></div>
  </div>
  <button class="one-hand-flip" id="oneHandFlip" type="button" title="Pindah sisi">⇄</button>
</div>

<script>
(function(){
  // ---------------- Note table: E2 (open low E) upward. Setiap tuts — termasuk spasi, Shift,
  // Backspace, Enter, dan tombol ganti mode — mendapat satu nada sendiri, berurutan dari nada
  // terendah (pojok kiri atas) ke nada tertinggi (pojok kanan bawah), mengikuti urutan visual keyboard. ----------------
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const BASE_MIDI = 40; // E2

  // Urutan visual keyboard (persis urutan render): baris angka, baris q-p, baris a-l,
  // [Shift] + baris z-m + [Backspace], lalu baris bawah [emoji][?123][,][spasi][.][Enter]
  const KEY_DEFS = [
    ...['1','2','3','4','5','6','7','8','9','0'].map(ch=>({type:'letter', char:ch})),
    ...['q','w','e','r','t','y','u','i','o','p'].map((ch,i)=>({type:'letter', char:ch, cornerNum:(i+1)%10})),
    ...['a','s','d','f','g','h','j','k','l'].map(ch=>({type:'letter', char:ch})),
    {type:'shift'},
    ...['z','x','c','v','b','n','m'].map(ch=>({type:'letter', char:ch})),
    {type:'backspace'},
    {type:'num-toggle'},
    {type:'emoji-toggle'},
    {type:'literal', char:',', label:','},
    {type:'literal', char:' ', label:'spasi', big:true},
    {type:'literal', char:'.', label:'.'},
    {type:'enter'},
  ];
  const NOTE_COUNT = KEY_DEFS.length; // 44

  // Rentang index (di KEY_DEFS / NOTES) tuts huruf yang boleh diganti jadi simbol / huruf besar
  const LETTER_INDICES = [
    ...Array.from({length:10},(_,i)=>10+i), // baris q-p
    ...Array.from({length:9},(_,i)=>20+i),  // baris a-l
    ...Array.from({length:7},(_,i)=>30+i),  // baris z-m
  ];

  // Standard guitar tuning (open string MIDI numbers), string 6 = low E to string 1 = high e
  const TUNING = [
    {string:6, open:'E', midi:40},
    {string:5, open:'A', midi:45},
    {string:4, open:'D', midi:50},
    {string:3, open:'G', midi:55},
    {string:2, open:'B', midi:59},
    {string:1, open:'e', midi:64},
  ];
  const MAX_FRET = 20;
  function findFret(midi){
    let best = null;
    TUNING.forEach(t=>{
      const fret = midi - t.midi;
      if(fret>=0 && fret<=MAX_FRET){
        if(!best || fret<best.fret) best = {string:t.string, open:t.open, fret};
      }
    });
    return best;
  }

  const NOTES = [];
  for(let i=0;i<NOTE_COUNT;i++){
    const midi = BASE_MIDI + i;
    const freq = 440 * Math.pow(2, (midi-69)/12);
    const name = NOTE_NAMES[((midi%12)+12)%12] + (Math.floor(midi/12)-1);
    const pos = findFret(midi);
    NOTES.push({
      idx: i, midi, freq, name,
      string: pos ? pos.string : null,
      fret: pos ? pos.fret : null
    });
  }

  // ---------------- Keyboard layout: SEMUA tuts (44) responsif nada ----------------
  const keyboardEl = document.getElementById('keyboard');
  const keyMap = {};      // char fisik -> element (huruf/angka/koma/spasi/titik)
  const allKeys = [];     // index 0..43 -> element, sejajar dengan NOTES

  function makeKeyEl(def, note){
    const btn = document.createElement('button');
    btn.dataset.freq = note.freq;
    btn.dataset.note = note.name;
    btn.dataset.string = note.string;
    btn.dataset.fret = note.fret;
    btn.title = note.name;

    if(def.type==='letter'){
      btn.className='key';
      btn.dataset.type='note';
      btn.dataset.origChar = def.char;
      const cornerBadge = (def.cornerNum!==undefined) ? '<span class="corner-num">'+def.cornerNum+'</span>' : '';
      btn.innerHTML = '<span class="ch">'+def.char+'</span><span class="tag">'+note.name+'</span>'+cornerBadge+'<span class="bubble"></span>';
      if(def.cornerNum!==undefined){
        btn.dataset.cornerNum = def.cornerNum;
        wireLongPressNumber(btn);
      } else {
        btn.addEventListener('pointerdown', ()=> manualPress(btn));
      }
      keyMap[def.char] = btn;
    } else if(def.type==='shift'){
      btn.className='key fn key-shift';
      btn.id='shiftBtn';
      btn.innerHTML='<span class="ch">⇧</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> shiftToggle(btn));
      keyMap['shift'] = btn;
    } else if(def.type==='backspace'){
      btn.className='key fn key-backspace';
      btn.dataset.type='backspace';
      btn.innerHTML='<span class="ch">⌫</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn)); // tekan sebentar = hapus 1 karakter, langsung, tanpa jeda
      wireLongPressRepeat(btn, backspace); // tahan = mulai berulang otomatis & makin cepat (lihat wireLongPressRepeat)
      keyMap['backspace'] = btn;
    } else if(def.type==='emoji-toggle'){
      btn.className='key fn'; btn.id='emojiBtn';
      btn.innerHTML='<span class="ch">😊</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=>{ flash(btn); setMode(mode==='emoji' ? 'letters' : 'emoji'); });
    } else if(def.type==='num-toggle'){
      btn.className='key fn'; btn.id='numBtn';
      btn.innerHTML='<span class="ch">?123</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=>{ flash(btn); setMode(mode==='symbols' ? 'letters' : 'symbols'); });
    } else if(def.type==='literal'){
      btn.className = def.big ? 'key space' : 'key';
      btn.dataset.type='literal';
      btn.dataset.char = def.char;
      btn.innerHTML = '<span class="ch">'+(def.label||def.char)+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn));
      keyMap[def.char] = btn;
    } else if(def.type==='enter'){
      btn.className='key fn key-enter';
      btn.dataset.type='enter';
      btn.innerHTML='<span class="ch">↵</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn));
      keyMap['enter'] = btn;
    }
    return btn;
  }

  function buildRow(defs, notes, extraClass){
    const row = document.createElement('div');
    row.className = extraClass ? ('krow '+extraClass) : 'krow';
    defs.forEach((def, i)=>{
      const note = notes[i];
      const el = makeKeyEl(def, note);
      row.appendChild(el);
      allKeys[note.idx] = el;
    });
    keyboardEl.appendChild(row);
    return row;
  }

  // Baris angka: disembunyikan secara default (persis Gboard -- baris angka
  // cuma muncul di mode ?123). Di mode huruf, angkanya "di belakang" tuts q-p
  // lewat badge pojok + tekan-tahan (lihat wireLongPressNumber di bawah).
  // Elemen tuts-nya TETAP dibuat & tetap terhubung penuh ke pemetaan nada gitar
  // (allKeys[idx]) walau tersembunyi -- petikan gitar di rentang nada itu tetap
  // jalan seperti biasa, cuma tidak kelihatan animasinya selama baris disembunyikan.
  const numberRowEl = buildRow(KEY_DEFS.slice(0,10),  NOTES.slice(0,10), 'krow-nums');   // angka
  buildRow(KEY_DEFS.slice(10,20), NOTES.slice(10,20));  // q-p
  buildRow(KEY_DEFS.slice(20,29), NOTES.slice(20,29));  // a-l
  buildRow(KEY_DEFS.slice(29,38), NOTES.slice(29,38));  // Shift + z-m + Backspace
  buildRow(KEY_DEFS.slice(38,44), NOTES.slice(38,44));  // emoji, ?123, , spasi . Enter

  // ---------------- Pelacak teks internal ----------------
  // Halaman ini sekarang murni tampilan keyboard (tidak ada kotak teks
  // visual). Variabel `text`/`cursorPos` di bawah TETAP dipertahankan
  // secara internal (tanpa dirender ke layar) karena masih dipakai untuk
  // fitur prediksi kata (lihat getCurrentWordRange) dan untuk menghitung
  // berapa karakter yang perlu dihapus saat kata diganti lewat saran.
  let text = '';
  let cursorPos = 0;

  // ---------------- Jembatan ke Android InputMethodService ----------------
  // Jika halaman ini dimuat di dalam HtmlKeyboardService.java (lewat addJavascriptInterface),
  // window.AndroidKeyboard akan otomatis tersedia dan setiap ketikan diteruskan
  // ke InputConnection kolom teks yang sedang aktif (WhatsApp, Instagram, dll).
  // Kalau dibuka di browser biasa untuk uji coba, bridge ini tidak ada sehingga
  // keyboard tetap berfungsi normal memakai kotak teks internal di atas.
  function hasAndroidBridge(){
    return !!(window.AndroidKeyboard && window.AndroidKeyboard.commitText);
  }
  function bridgeCommit(str){
    if(hasAndroidBridge()){
      try{ window.AndroidKeyboard.commitText(str); }catch(e){}
    }
  }
  function bridgeDeleteBackward(){
    if(window.AndroidKeyboard && window.AndroidKeyboard.deleteBackward){
      try{ window.AndroidKeyboard.deleteBackward(); }catch(e){}
    }
  }
  function bridgeEnter(){
    if(window.AndroidKeyboard && window.AndroidKeyboard.sendEnter){
      try{ window.AndroidKeyboard.sendEnter(); return true; }catch(e){}
    }
    return false;
  }

  function appendText(str){
    text = text.slice(0,cursorPos) + str + text.slice(cursorPos);
    cursorPos += str.length;
    bridgeCommit(str);
    renderSuggestions();
    if(document.getElementById('translatePanel').style.display==='flex') updateTranslatePreview();
  }
  function backspace(){
    if(cursorPos<=0) return;
    text = text.slice(0,cursorPos-1) + text.slice(cursorPos);
    cursorPos -= 1;
    bridgeDeleteBackward();
    renderSuggestions();
    if(document.getElementById('translatePanel').style.display==='flex') updateTranslatePreview();
  }
  function pressEnter(){
    // Panggil sendEnter() dulu (bisa memicu tombol Kirim/Cari sesuai kolom aktif),
    // baru perbarui pelacak teks lokal secara terpisah agar tidak terkirim dobel.
    bridgeEnter();
    text = text.slice(0,cursorPos) + '\n' + text.slice(cursorPos);
    cursorPos += 1;
    renderSuggestions();
  }

  // ---------------- Bubble + flash ----------------
  function flash(el){ el.classList.add('is-active'); setTimeout(()=> el.classList.remove('is-active'), 80); }
  function showBubble(el, label){
    const bubble = el.querySelector('.bubble');
    if(!bubble) return;
    bubble.textContent = label;
    bubble.classList.add('show');
    setTimeout(()=> bubble.classList.remove('show'), 260);
  }
  function showStatus(msg){
    // Halaman ini sekarang murni keyboard, jadi satu-satunya tempat pesan
    // status (nada terdeteksi, error izin mikrofon, dsb) ditampilkan adalah
    // pita #imeStatus di dalam #kbWrap.
    const imeStatus = document.getElementById('imeStatus');
    if(!imeStatus) return;
    const isError = /ditolak|tidak tersedia|gagal|error/i.test(msg);
    imeStatus.textContent = msg.replace(/<[^>]*>/g, '');
    imeStatus.classList.add('show');
    imeStatus.classList.toggle('ok', !isError);
    clearTimeout(imeStatus._hideTimer);
    imeStatus._hideTimer = setTimeout(()=> imeStatus.classList.remove('show'), 4000);
  }

  // ---------------- Bridge tambahan: hapus beberapa karakter sekaligus (dipakai saat ganti kata via prediksi) ----------------
  function bridgeDeleteBackwardN(n){
    if(window.AndroidKeyboard && window.AndroidKeyboard.deleteBackwardN){
      try{ window.AndroidKeyboard.deleteBackwardN(n); return; }catch(e){}
    }
    // Fallback kalau bridge lama belum punya deleteBackwardN: panggil deleteBackward berkali-kali.
    for(let i=0;i<n;i++) bridgeDeleteBackward();
  }

  // ---------------- Fitur 1: Prediksi kata / saran ketikan ----------------
  const DICTIONARY = [...new Set(['saya','kamu','dia','kita','kami','mereka','aku','anda','ini','itu',
    'yang','dan','atau','tapi','tetapi','karena','jika','kalau','maka','supaya','agar',
    'akan','sudah','belum','sedang','masih','tidak','bukan','jangan','boleh','harus',
    'bisa','mau','ingin','suka','cinta','sayang','baik','bagus','buruk','jelek',
    'besar','kecil','banyak','sedikit','semua','sebagian','setiap','bagaimana','kenapa','mengapa',
    'kapan','dimana','siapa','apa','apakah','iya','oke','baiklah','terima',
    'kasih','terimakasih','maaf','permisi','tolong','mohon','silakan','selamat','pagi','siang',
    'sore','malam','hari','besok','kemarin','sekarang','nanti','tadi','lagi',
    'juga','hanya','saja','cuma','memang','sebenarnya','sebetulnya','mungkin','pasti','tentu',
    'gitar','musik','lagu','nada','main','bermain','nyanyi','chord','senar','ketik',
    'kerja','sekolah','kuliah','rumah','jalan','makan','minum','tidur','bangun','pulang',
    'pergi','datang','sampai','tunggu','sabar','cepat','lambat','pelan',
    'whatsapp','chat','pesan','telepon','video','foto','kirim','buka','tutup',
    'website','aplikasi','android','keyboard','fitur','update','baru','lama','coba','tes'])];

  function getCurrentWordRange(){
    let start = cursorPos;
    while(start>0 && !/[\s\n]/.test(text[start-1])) start--;
    return { start, end: cursorPos, word: text.slice(start, cursorPos) };
  }

  function renderSuggestions(){
    const bar = document.getElementById('suggestBar');
    bar.innerHTML = '';
    const { word } = getCurrentWordRange();
    let candidates = [];
    if(word.length > 0){
      const lower = word.toLowerCase();
      // Cuma tampilkan saran kata SUNGGUHAN dari kamus yang cocok awalannya.
      // Sebelumnya chip pertama selalu mengulang kata yang sedang diketik apa
      // adanya -- itu bukan saran, cuma gema dari ketikan sendiri, dan makin
      // panjang katanya makin memanjang juga chip-nya, bikin bingung dikira
      // ada "ketikan tersimpan". Sekarang dihapus; kalau tidak ada kata di
      // kamus yang cocok, baris saran otomatis kosong.
      candidates = DICTIONARY.filter(w => w.startsWith(lower) && w.toLowerCase() !== lower).slice(0,3);
    } else {
      candidates = ['Halo', 'Terima kasih', 'Oke'];
    }
    candidates.forEach((c) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'suggest-chip';
      chip.textContent = c;
      chip.addEventListener('pointerdown', () => applySuggestion(c));
      bar.appendChild(chip);
    });
  }

  function applySuggestion(chosen){
    const { start, end, word } = getCurrentWordRange();
    const removeCount = word.length;
    text = text.slice(0, start) + chosen + ' ' + text.slice(end);
    cursorPos = start + chosen.length + 1;
    if(removeCount > 0) bridgeDeleteBackwardN(removeCount);
    bridgeCommit(chosen + ' ');
    renderSuggestions();
  }

  // ---------------- Fitur 2: Clipboard riwayat ----------------
  let clipboardHistory = [];
  try{ clipboardHistory = JSON.parse(localStorage.getItem('genjreng_clipboard') || '[]'); }catch(e){}

  function saveClipboardHistory(){
    try{ localStorage.setItem('genjreng_clipboard', JSON.stringify(clipboardHistory.slice(0,15))); }catch(e){}
  }
  function renderClipboardPanel(){
    const panel = document.getElementById('clipboardPanel');
    panel.innerHTML = '';
    if(clipboardHistory.length === 0){
      const empty = document.createElement('div');
      empty.className = 'clipboard-empty';
      empty.textContent = 'Belum ada riwayat copy. Copy teks di aplikasi lain, nanti muncul di sini.';
      panel.appendChild(empty);
      return;
    }
    const toolbar = document.createElement('div');
    toolbar.className = 'clipboard-toolbar';
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'clipboard-clear';
    clearBtn.textContent = 'Hapus semua';
    clearBtn.addEventListener('pointerdown', () => {
      clipboardHistory = [];
      saveClipboardHistory();
      renderClipboardPanel();
    });
    toolbar.appendChild(clearBtn);
    panel.appendChild(toolbar);

    clipboardHistory.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'clipboard-item-row';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'clipboard-item';
      btn.textContent = item;
      btn.addEventListener('pointerdown', () => {
        appendText(item);
        renderSuggestions();
      });
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'clipboard-item-del';
      del.textContent = '✕';
      del.title = 'Hapus item ini';
      del.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        clipboardHistory.splice(i, 1);
        saveClipboardHistory();
        renderClipboardPanel();
      });
      row.appendChild(btn);
      row.appendChild(del);
      panel.appendChild(row);
    });
  }
  // Dipanggil dari sisi Java (HtmlKeyboardService) setiap kali clipboard sistem Android berubah.
  window.onClipboardChanged = function(newText){
    if(!newText) return;
    clipboardHistory = clipboardHistory.filter(t => t !== newText);
    clipboardHistory.unshift(newText);
    clipboardHistory = clipboardHistory.slice(0,15);
    saveClipboardHistory();
    renderClipboardPanel();
  };

  // ---------------- Fitur 2b: Panel GIF ----------------
  // CATATAN JUJUR: ini BELUM nyambung ke pencarian GIF asli (mis. Tenor/GIPHY),
  // karena itu butuh koneksi internet + API key di sisi native, dan keyboard
  // ini didesain jalan offline. Yang ada di bawah cuma placeholder "stiker"
  // pakai emoji besar biar tata letak & rasanya sudah sama kayak panel GIF
  // Gboard. Kalau nanti mau pasang GIF sungguhan:
  //   1) Tambah pemanggilan API Tenor di sisi Java (butuh API key + internet).
  //   2) Kirim hasil URL gif-nya ke sini, lalu render <img> di grid ini.
  //   3) Untuk MENGIRIM gif ke kolom teks aplikasi lain, InputMethodService
  //      perlu commitContent() (bukan cuma commitText), lihat dokumentasi
  //      InputConnection.commitContent di Android — beda jalur dari commitText.
  const GIF_STICKERS = [
    {label:'Semangat', emoji:'🔥'}, {label:'Ketawa', emoji:'😂'}, {label:'Cinta', emoji:'🥰'},
    {label:'Oke', emoji:'👍'}, {label:'Sedih', emoji:'😢'}, {label:'Kaget', emoji:'😲'},
    {label:'Gitar', emoji:'🎸'}, {label:'Pesta', emoji:'🎉'}, {label:'Ngantuk', emoji:'😴'},
  ];
  function renderGifPanel(){
    const panel = document.getElementById('gifPanel');
    panel.innerHTML = '';
    GIF_STICKERS.forEach(s => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'gif-item';
      btn.innerHTML = '<span>'+s.emoji+'</span><span class="gif-label">'+s.label+'</span>';
      btn.addEventListener('pointerdown', () => {
        // Kalau nanti ada jembatan native buat kirim gif sungguhan, pakai itu;
        // kalau belum ada (mis. lagi dicoba di browser), fallback kirim emoji-nya saja.
        if(window.AndroidKeyboard && window.AndroidKeyboard.commitGif){
          try{ window.AndroidKeyboard.commitGif(s.label); return; }catch(e){}
        }
        appendText(s.emoji);
      });
      panel.appendChild(btn);
    });
  }

  // ---------------- Fitur 2c: Mode Terjemah ----------------
  // CATATAN JUJUR: sama seperti GIF, ini BELUM nyambung ke mesin terjemahan
  // sungguhan (mis. Google Cloud Translation) karena itu juga butuh internet +
  // API key. Kamus di bawah cuma contoh kecil kata-per-kata (offline) biar
  // fiturnya kelihatan & bisa dicoba. Kalau nanti mau pasang API asli:
  //   - Ganti isi fungsi translateText() supaya manggil
  //     window.AndroidKeyboard.translateText(text, from, to) (jembatan baru
  //     yang perlu ditambah di HtmlKeyboardService.java, yang di baliknya
  //     manggil API terjemahan lewat internet), lalu tampilkan hasilnya di sini.
  const MINI_DICT_ID_EN = {
    'saya':'i','kamu':'you','aku':'i','dia':'he/she','kita':'we','kami':'we','mereka':'they',
    'ini':'this','itu':'that','yang':'which','dan':'and','atau':'or','tapi':'but','karena':'because',
    'jika':'if','akan':'will','sudah':'already','belum':'not yet','tidak':'not','bukan':'not',
    'boleh':'may','harus':'must','bisa':'can','mau':'want','ingin':'want','suka':'like','cinta':'love',
    'baik':'good','bagus':'good','besar':'big','kecil':'small','banyak':'many','sedikit':'a little',
    'apa':'what','siapa':'who','kapan':'when','dimana':'where','kenapa':'why','mengapa':'why',
    'iya':'yes','oke':'okay','terima kasih':'thank you','maaf':'sorry','tolong':'please',
    'selamat pagi':'good morning','selamat malam':'good night','sekarang':'now','besok':'tomorrow',
    'kemarin':'yesterday','gitar':'guitar','musik':'music','lagu':'song','nada':'note','main':'play',
    'rumah':'house','makan':'eat','minum':'drink','tidur':'sleep','pergi':'go','datang':'come',
    'cepat':'fast','lambat':'slow','pelan':'slow','kirim':'send','buka':'open','tutup':'close',
    'aplikasi':'application','baru':'new','lama':'old'
  };
  const MINI_DICT_EN_ID = Object.fromEntries(Object.entries(MINI_DICT_ID_EN).map(([id,en])=>[en,id]));

  function translateText(str, from, to){
    if(window.AndroidKeyboard && window.AndroidKeyboard.translateText){
      try{ return window.AndroidKeyboard.translateText(str, from, to); }catch(e){}
    }
    const dict = (from==='id' && to==='en') ? MINI_DICT_ID_EN
               : (from==='en' && to==='id') ? MINI_DICT_EN_ID : null;
    if(!dict || !str.trim()) return str;
    return str.trim().split(/\s+/).map(w=>{
      const clean = w.toLowerCase().replace(/[.,!?]/g,'');
      return dict[clean] || w;
    }).join(' ');
  }

  function updateTranslatePreview(){
    const from = document.getElementById('translateFrom').value;
    const to = document.getElementById('translateTo').value;
    const preview = document.getElementById('translatePreview');
    if(!text.trim()){
      preview.textContent = 'Ketik pakai tuts di bawah, hasil terjemahan muncul di sini…';
      return;
    }
    preview.textContent = translateText(text, from, to);
  }

  // ---------------- Fitur 3: Tema warna (termasuk "Otomatis" -> ikut Dark/Light Mode sistem HP) ----------------
  let currentThemeSetting = 'dark';
  const systemThemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  function resolveAutoTheme(){
    return (systemThemeQuery && systemThemeQuery.matches) ? 'light' : 'dark';
  }
  function applyTheme(name){
    currentThemeSetting = name;
    const resolved = (name === 'auto') ? resolveAutoTheme() : name;
    document.body.className = document.body.className.replace(/theme-\S+/g, '').trim();
    if(resolved !== 'dark') document.body.classList.add('theme-' + resolved);
    document.querySelectorAll('.theme-swatch').forEach(sw => {
      sw.classList.toggle('selected', sw.dataset.theme === name);
    });
    try{ localStorage.setItem('genjreng_theme', name); }catch(e){}
  }
  function loadSavedTheme(){
    let saved = 'dark';
    try{ saved = localStorage.getItem('genjreng_theme') || 'dark'; }catch(e){}
    applyTheme(saved);
  }
  // Kalau tema "Otomatis" dipilih, ikuti perubahan Dark/Light Mode sistem HP secara live.
  if(systemThemeQuery){
    systemThemeQuery.addEventListener('change', ()=>{
      if(currentThemeSetting === 'auto') applyTheme('auto');
    });
  }

  function applyKeyBorder(on){

  // ---------------- Fitur: Ukuran huruf tuts (85%–200%), sama seperti pengaturan
  // font size di Gboard terbaru ----------------
  function applyFontScale(pct){
    const clamped = Math.max(85, Math.min(200, pct));
    document.documentElement.style.setProperty('--key-font-scale', (clamped/100).toFixed(2));
    const label = document.getElementById('fontScaleLabel');
    if(label) label.textContent = clamped + '%';

    try{ saved = parseInt(localStorage.getItem('genjreng_font_scale'), 10) || 100; }catch(e){}

  // ---------------- Keyboard modes: letters / symbols / emoji, plus Shift state ----------------

  const EMOJIS = ['😀','😂','🥰','😎','🤔','😢','😡','👍','👎','👏','🙏','🔥','🎸','🎵','🎶','🎤','❤️','✨','🎉','💯','⭐','☀️','🌙','⚡','🍕','☕','🚀','✅','❌','😴','🥳','🤩','💜','🌈','🎂','🙌','😉','🥲','😇','🤗','🙃','😅','👋','🎈'];

  // Tombol "kembali ke huruf" khusus di dalam panel emoji.

  wireLongPressRepeat(emojiDeleteBtn, backspace); // tahan = hapus berulang & makin cepat, sama seperti tuts hapus utama

  function setMode(newMode){

  // ---------------- Tekan-tahan tuts q-p buat ambil angka pojok (persis Gboard) ----------------
  const LONG_PRESS_MS = 320;         // ambang lama tekan sebelum dianggap "tahan"
  const LONG_PRESS_MOVE_TOLERANCE = 18; // px -- geser lebih dari ini sebelum ambang = batal (ketarik keluar)

  function wireLongPressNumber(btn){
    let timer = null;
    let longPressFired = false;
    let cancelled = false;
    let startX = 0, startY = 0;

    function clearTimer(){ if(timer){ clearTimeout(timer); timer = null; } }

    btn.addEventListener('pointerdown', (e)=>{
      longPressFired = false;
      cancelled = false;
      startX = e.clientX; startY = e.clientY;
      flash(btn);
      clearTimer();
      timer = setTimeout(()=>{
        timer = null;
        if(cancelled) return;
        longPressFired = true;
        btn.classList.add('key-longpress-num');
        const num = btn.dataset.cornerNum;
        showBubble(btn, num);
        appendText(num);
        if(navigator.vibrate) navigator.vibrate(8);
      }, LONG_PRESS_MS);
    });
    btn.addEventListener('pointermove', (e)=>{
      if(timer==null) return; // sudah kepencet lama / sudah batal, gak perlu dicek lagi
      if(Math.abs(e.clientX-startX) > LONG_PRESS_MOVE_TOLERANCE || Math.abs(e.clientY-startY) > LONG_PRESS_MOVE_TOLERANCE){
        cancelled = true;
        clearTimer();
      }
    });
    function release(){
      clearTimer();
      btn.classList.remove('key-longpress-num');
      if(!longPressFired && !cancelled){
        manualPress(btn); // tekan sebentar (belum sampai ambang) = ketik huruf/simbol seperti biasa
      }
      longPressFired = false;
      cancelled = false;
    }
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', ()=>{ clearTimer(); btn.classList.remove('key-longpress-num'); cancelled = true; });
    btn.addEventListener('pointerleave', ()=>{
      if(timer!=null){ cancelled = true; clearTimer(); } // jari geser keluar tuts sebelum ambang = batal
    });
  }

  // ---------------- Tekan-tahan Backspace: hapus berulang & makin cepat (persis Gboard) ----------------
  // Gboard: tekan sebentar = hapus 1 karakter (sudah terjadi lewat pointerdown biasa).
  // Tahan = mulai mengulang otomatis setelah jeda awal, lalu makin cepat makin lama ditahan,
  // sampai akhirnya ngebut di interval tercepat -- bukan interval tetap dari awal.
  function wireLongPressRepeat(btn, action){
    const INITIAL_DELAY_MS = 420;   // jeda sebelum mulai berulang otomatis
    const START_INTERVAL_MS = 110;  // interval berulang di awal
    const MIN_INTERVAL_MS = 28;     // interval tercepat setelah dipercepat penuh
    const ACCEL_MS = 900;           // durasi tahan sampai interval mencapai kecepatan tercepat
    let repeatTimer = null;
    let startedAt = 0;
    let active = false;

    function scheduleNext(){
      const held = performance.now() - startedAt;
      const t = Math.min(1, held / ACCEL_MS);
      const interval = START_INTERVAL_MS + (MIN_INTERVAL_MS - START_INTERVAL_MS) * t;
      repeatTimer = setTimeout(()=>{
        if(!active) return;
        action();
        scheduleNext();
      }, interval);
    }
    function stop(){
      active = false;
      if(repeatTimer){ clearTimeout(repeatTimer); repeatTimer = null; }
    }
    btn.addEventListener('pointerdown', ()=>{
      stop();
      active = true;
      startedAt = performance.now();
      repeatTimer = setTimeout(()=>{
        if(!active) return;
        scheduleNext();
      }, INITIAL_DELAY_MS);
    });
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
  }

  // ---------------- Key actions (silent — no internal synthesized audio) ----------------
  function manualPress(el){
    flash(el);
    let ch;
    if(mode==='symbols' && el.dataset.symbolChar){
      ch = el.dataset.symbolChar;
    } else {
      const base = el.dataset.origChar;
      ch = (shiftActive && /^[a-z]$/.test(base)) ? base.toUpperCase() : base;
      if(shiftActive && !capsLock){ shiftActive=false; updateShiftVisual(); }
    }
    showBubble(el, ch);
    appendText(ch);
  }
  function functionalPress(el){
    flash(el);
    const type = el.dataset.type;
    if(type==='backspace'){ showBubble(el,'⌫'); backspace(); }
    else if(type==='enter'){ showBubble(el,'↵'); pressEnter(); }
    else if(type==='literal'){ const c = el.dataset.char; showBubble(el, c===' '?'␣':c); appendText(c); }
  }
  function autoTypeNote(idx){
    if(mode==='emoji'){
      const el = emojiKeys[idx];
      if(!el) return null;
      flash(el);
      const emo = el.dataset.emoji;
      showBubble(el, emo);
      appendText(emo);
      return emo;
    }

    const el = allKeys[idx];
    if(!el) return null;
    const type = el.dataset.type;

    if(type==='note'){
      flash(el);
      const base = el.dataset.origChar;
      let ch;
      if(mode==='symbols' && el.dataset.symbolChar){
        ch = el.dataset.symbolChar;
      } else {
        ch = (shiftActive && /^[a-z]$/.test(base)) ? base.toUpperCase() : base;
      }
      showBubble(el, ch);
      appendText(ch);
      if(mode!=='symbols' && shiftActive && !capsLock){ shiftActive=false; updateShiftVisual(); }
      return ch;
    } else if(type==='literal'){
      flash(el);
      const c = el.dataset.char;
      showBubble(el, c===' ' ? '␣' : c);
      appendText(c);
      return c;
    } else if(type==='backspace'){
      flash(el); showBubble(el,'⌫'); backspace();
      return '⌫';
    } else if(type==='enter'){
      flash(el); showBubble(el,'↵'); pressEnter();
      return '\n';
    } else if(el.id==='shiftBtn'){
      shiftToggle(el);
      showBubble(el, capsLock ? 'CAPS' : (shiftActive ? '⇧ ON' : '⇧'));
      return '⇧';
    } else if(el.id==='emojiBtn'){
      flash(el);
      setMode(mode==='emoji' ? 'letters' : 'emoji');
      showBubble(el, mode==='emoji' ? '😊' : 'ABC');
      return '😊';
    } else if(el.id==='numBtn'){
      flash(el);
      setMode(mode==='symbols' ? 'letters' : 'symbols');
      showBubble(el, mode==='symbols' ? '?123' : 'ABC');
      return '?123';
    }
    return null;
  }

  // ---------------- Mic: jalur NATIVE (AudioRecord Java), PRIORITAS UTAMA ----------------
  // getUserMedia() di WebView gagal terus di sebagian HP (NotAllowedError) meski izin
  // sistem sudah "Diizinkan" -- kemungkinan pembatasan WebView/OEM yang di luar jangkauan
  // kode web. Kalau window.AndroidKeyboard.startNativeMic tersedia (artinya berjalan di
  // dalam APK asli), pakai jalur ini: rekam + deteksi nada dilakukan di kode Java native
  // (lihat NativeMicPitchDetector.java), hasilnya langsung dikirim ke sini secara instan.
  function hasNativeMicBridge(){
    return !!(window.AndroidKeyboard && window.AndroidKeyboard.startNativeMic);
  }

  window.onNativeMicStatus = function(kind, ok){
    if(kind === 'permission' && !ok){
      showStatus('❌ Izin mikrofon belum aktif. Buka aplikasi Guitar Witer dari app drawer sekali, izinkan mikrofonnya, lalu coba lagi.');
      listening = false;
      micToolBtn.classList.remove('on');
      return;
    }
    if(kind === 'listening'){
      showStatus('🎙️ Mendengarkan… petik satu nada.');
    } else if(kind === 'onset'){
      showStatus('Mendengar petikan…');
    }
  };
  window.onNativePitchIndex = function(idx, freq){
    if(idx>=0 && idx<NOTE_COUNT){
      const typed = autoTypeNote(idx);
      const noteName = NOTES[idx].name;
      const label = (typed===' ') ? '␣' : (typed==='\n' ? '↵' : typed);
      showStatus('Nada <b>'+noteName+'</b> ('+Math.round(freq)+' Hz) → <b>"'+label+'"</b>');
    }
  };
  window.onNativeOutOfRange = function(freq){
    showStatus('Nada di luar jangkauan '+NOTES[0].name+'–'+NOTES[NOTE_COUNT-1].name+' ('+Math.round(freq)+' Hz).');
  };
  window.onNativeUnclear = function(){
    showStatus('Nada belum terdeteksi jelas, coba petik lagi.');
  };

  // ---------------- Mic: monophonic pitch detection (autocorrelation) ----------------
  let listening=false, micCtx=null, analyser=null, stream=null, rafId=null;
  // state: 'idle' (siap deteksi onset baru) -> 'sampling' (lagi mengukur nada) ->
  // 'releasing' (nunggu senar benar-benar mereda) -> balik ke 'idle'.
  let state='idle', sampleAt=0, cooldownUntil=0, smoothedRms=0.001;
  let sampleTries=0;
  // Jeda waktu minimum SETELAH sebuah nada dikomit, sebelum boleh dianggap ada
  // petikan baru sama sekali -- HARUS sama persis dengan COOLDOWN_MS di
  // NativeMicPitchDetector.java.
  const COOLDOWN_MS = 180;
  // PENTING (fix "kedeteksi ganda / dobel ketikan"): dulu, begitu COOLDOWN_MS
  // lewat, sistem langsung siap mendeteksi onset baru lagi -- padahal senar
  // gitar yang baru dipetik itu MASIH BERDENGUNG jauh lebih lama dari 180ms.
  // Kalau dengungannya sempat naik-turun (beating antar harmonik, getaran
  // senar lain yang ikut bergetar simpatik, dst), itu bisa kebaca sebagai
  // "petikan baru" walau sebenarnya masih nada yang sama -> jadi ketikan dobel
  // dari satu kali petik.
  //
  // Perbaikan: sesudah komit, sistem WAJIB nunggu RMS-nya turun di bawah
  // RELEASE_RMS dulu (bukan cuma nunggu waktu) baru boleh siap deteksi onset
  // baru lagi -- persis seperti "note off" di synth, bukan cuma timer. Kalau
  // dengungannya memang lama sekali (mis. senar terbuka dibiarkan berbunyi),
  // MAX_RELEASE_WAIT_MS jadi jaring pengaman supaya tidak macet permanen.
  // HARUS sama persis dengan RELEASE_RMS & MAX_RELEASE_WAIT_MS di
  // NativeMicPitchDetector.java.
  const RELEASE_RMS = 0.018;
  const MAX_RELEASE_WAIT_MS = 1500;
  let releaseWaitUntil = 0;

  function freqToMidi(freq){ return 69 + 12*Math.log2(freq/440); }
  function freqToIdx(freq){ return Math.round(freqToMidi(freq)) - BASE_MIDI; }

  function commitDetectedNote(freq){
    const idx = freqToIdx(freq);
    if(idx>=0 && idx<NOTE_COUNT){
      const typed = autoTypeNote(idx);
      const noteName = NOTES[idx].name;
      const label = (typed===' ') ? '␣' : (typed==='\n' ? '↵' : typed);
      showStatus('Nada <b>'+noteName+'</b> ('+freq.toFixed(0)+' Hz) → <b>"'+label+'"</b>');
    } else {
      showStatus('Nada di luar jangkauan '+NOTES[0].name+'–'+NOTES[NOTE_COUNT-1].name+' ('+freq.toFixed(0)+' Hz).');
    }
  }

  // Mengembalikan {freq, clarity} atau null. "clarity" (0..1) mengukur seberapa
  // periodik sinyalnya — dekat 1 berarti nada tunggal yang bersih (senar dipetik
  // jelas), rendah berarti kemungkinan besar noise/dengung/lebih dari satu senar
  // berbunyi bareng. Nilai ini dipakai buat nyaring hasil yang meragukan supaya
  // huruf yang terketik gak salah-salah lagi.
  // Batas frekuensi yang masuk akal buat dicari (rentang nada gitar yang dipetakan
  // ke tuts, dikasih sedikit margin di kedua ujung). Membatasi rentang pencarian
  // begini bukan cuma bikin lebih cepat (jauh lebih sedikit "tau" yang dicek
  // dibanding menyisir seluruh buffer), tapi juga bikin YIN lebih tegas — dia
  // gak akan pernah mempertimbangkan periode yang jelas-jelas di luar jangkauan
  // gitar sebagai kandidat nada.
  const MIN_VALID_FREQ = 440 * Math.pow(2, (BASE_MIDI - 3 - 69) / 12);
  const MAX_VALID_FREQ = 440 * Math.pow(2, (BASE_MIDI + NOTE_COUNT - 1 + 3 - 69) / 12);

  /**
   * Deteksi pitch pakai algoritma YIN (De Cheveigné & Kawahara, 2002) —
   * dipakai juga di tuner-tuner gitar profesional. Bedanya sama autokorelasi
   * biasa: YIN pakai "cumulative mean normalized difference function" yang
   * secara struktural jauh lebih tahan salah pilih oktaf (misalnya F2 kebaca
   * F3 karena harmonik ke-2 gitar sering lebih kuat dari nada dasarnya sendiri
   * — autokorelasi polos gampang kejebak di situ, YIN jauh lebih jarang).
   * Return {freq, probability} kalau yakin, atau null kalau sinyalnya
   * kurang periodik/kurang jelas (noise, senar teredam, dll).
   */
  function yinDetect(buf, sampleRate){
    const SIZE = buf.length;
    let rms=0;
    for(let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
    rms = Math.sqrt(rms/SIZE);
    if(rms < 0.012) return null;

    const minTau = Math.max(2, Math.floor(sampleRate / MAX_VALID_FREQ));
    const maxTau = Math.min(Math.floor(SIZE/2) - 1, Math.ceil(sampleRate / MIN_VALID_FREQ));
    if(maxTau <= minTau) return null;

    // Langkah 1: fungsi selisih d(tau) = jumlah (x[j]-x[j+tau])^2, cuma dihitung
    // untuk rentang tau yang relevan (hemat -- gak perlu hitung tau di luar jangkauan gitar).
    const diff = new Float32Array(maxTau + 1);
    for(let tau=minTau; tau<=maxTau; tau++){
      let sum=0;
      for(let j=0; j<SIZE-maxTau; j++){
        const d = buf[j]-buf[j+tau];
        sum += d*d;
      }
      diff[tau]=sum;
    }

    // Langkah 2: cumulative mean normalized difference function (CMNDF) —
    // inti dari YIN yang bikin dia jauh lebih tegas milih periode fundamental
    // dibanding cuma lihat puncak korelasi mentah seperti autokorelasi biasa.
    const cmnd = new Float32Array(maxTau + 1);
    let runningSum = 0;
    cmnd[minTau] = 1;
    for(let tau=minTau+1; tau<=maxTau; tau++){
      runningSum += diff[tau];
      cmnd[tau] = diff[tau] * (tau - minTau) / (runningSum || 1e-9);
    }

    // Langkah 3: cari tau TERKECIL (frekuensi tertinggi yang valid) yang CMNDF-nya
    // sudah di bawah ambang batas -- ini cara YIN menghindari salah pilih oktaf
    // ke bawah (keliru mengunci ke 2x periode/setengah frekuensi asli).
    const THRESHOLD = 0.15;
    let tauEstimate = -1;
    for(let tau=minTau+1; tau<=maxTau; tau++){
      if(cmnd[tau] < THRESHOLD){
        while(tau+1<=maxTau && cmnd[tau+1] < cmnd[tau]) tau++; // turun ke lembah lokalnya
        tauEstimate = tau;
        break;
      }
    }
    if(tauEstimate === -1) return null; // gak ada periode yang cukup jelas -> bukan nada tunggal yang bersih

    // Langkah 3b: koreksi oktaf. Loop di atas sengaja mulai dari tau TERKECIL
    // (frekuensi tertinggi) supaya cepat berhenti di dip pertama yang meyakinkan --
    // tapi ini justru sumber utama salah tangkap F2/F3: kalau harmonik ke-2 gitar
    // (2x frekuensi asli / separuh periode) cukup kuat, dip CMNDF-nya SERING lebih
    // dulu ketemu (tau lebih kecil) daripada dip di periode fundamental yang
    // sebenarnya, jadi nada kekunci satu oktaf ketinggian.
    // Perbaikannya: cek juga kandidat "subharmonik" tepat di sekitar 2x tauEstimate
    // (yaitu separuh frekuensi, satu oktaf di bawah). Kalau dip di sana SAMA
    // meyakinkannya (CMNDF-nya tidak jauh lebih buruk), fundamental yang sebenarnya
    // hampir selalu di sana, bukan di tau yang lebih pendek -- jadi lebih baik pilih
    // yang lebih rendah (lebih "hemat", prinsip umum di semua pitch tracker).
    let bestTau = tauEstimate;
    const octaveCandidate = tauEstimate * 2;
    if(octaveCandidate <= maxTau){
      // cari dip lokal di sekitar octaveCandidate (bukan cuma titik persisnya --
      // periode sebenarnya biasanya meleset dikit dari 2x bulat). Margin dilebarkan
      // dari 12% ke 15% -- pada beberapa petikan gitar (senar lebih tua/pickup
      // tertentu), dip subharmonik-nya meleset lebih dari 12% dari 2x tau, jadi
      // window pencarian lama bisa kelewatan dan gagal ketemu.
      let searchLo = Math.max(minTau, octaveCandidate - Math.max(2, Math.round(tauEstimate*0.15)));
      let searchHi = Math.min(maxTau, octaveCandidate + Math.max(2, Math.round(tauEstimate*0.15)));
      let localMinTau = -1, localMinVal = Infinity;
      for(let t=searchLo; t<=searchHi; t++){
        if(cmnd[t] < localMinVal){ localMinVal = cmnd[t]; localMinTau = t; }
      }
      // Ambang toleransi: kalau dip subharmonik cuma agak lebih lemah (bukan jauh
      // lebih buruk) dari dip yang ditemukan di tau pendek, anggap fundamental
      // sebenarnya ada di sana. Dinaikkan dari 1.05 ke 1.3 -- laporan lapangan
      // menunjukkan F2 masih sering kekunci ke F3 (harmonik ke-2-nya sering JAUH
      // lebih kuat di gitar akustik/elektrik tertentu), jadi 1.05 terlalu ketat;
      // 1.3 cukup longgar buat menangkap kasus itu tanpa mulai salah pilih pas
      // memang betul-betul beda nada (nada berbeda biasanya dip-nya jauh lebih
      // buruk dari 1.3x, bukan cuma sedikit).
      if(localMinTau !== -1 && localMinVal < THRESHOLD && localMinVal <= cmnd[tauEstimate] * 1.3){
        bestTau = localMinTau;
      }
    }
    tauEstimate = bestTau;

    // Langkah 4: interpolasi parabola di sekitar tauEstimate biar hasil frekuensinya presisi
    // (gak dibatasi kelipatan bulat sample, penting buat toleransi ala tuner).
    const x0 = tauEstimate>minTau ? tauEstimate-1 : tauEstimate;
    const x2 = tauEstimate<maxTau ? tauEstimate+1 : tauEstimate;
    let betterTau = tauEstimate;
    if(x0!==tauEstimate && x2!==tauEstimate){
      const s0=cmnd[x0], s1=cmnd[tauEstimate], s2=cmnd[x2];
      const denom = 2*(2*s1 - s2 - s0);
      if(denom) betterTau = tauEstimate + (s2 - s0)/denom;
    }
    if(betterTau<=0) return null;

    const probability = 1 - cmnd[tauEstimate]; // makin dekat 1 = makin yakin/periodik
    return { freq: sampleRate/betterTau, clarity: probability };
  }

  // ---- Perbaikan "ketuker kategori" (angka<->huruf, angka<->tanda baca, dst) ----
  // Nada disusun kromatis berurutan (per setengah nada) dari terendah ke tertinggi:
  // baris angka (idx 0-9), lalu huruf/simbol (idx 10-19,20-28,30-36), tombol
  // fungsi (shift/backspace/toggle/enter), lalu tanda baca (idx 40-42). Karena
  // urutannya kontinu, batas antar kategori (mis. idx 9 ke idx 10) cuma
  // terpisah SATU setengah-nada -- kalau deteksi pitch meleset dikit persis di
  // batas itu, niat angka bisa kebaca sebagai huruf/tanda baca atau sebaliknya.
  function categoryOfIndex(idx){
    if(idx>=0 && idx<=9) return 'digit';
    if(idx===29 || idx===37 || idx===38 || idx===39 || idx===43) return 'functional';
    if(idx>=40 && idx<=42) return 'punct';
    return 'letterOrSymbol';
  }
  // Cek apakah sebuah bacaan frekuensi cukup AMAN buat langsung dikomit tanpa
  // risiko ketuker ke nada tetangga -- baik ketuker KATEGORI (angka jadi
  // huruf/tanda baca) MAUPUN ketuker nada tetangga SESAMA kategori (mis. G2
  // kebaca F#2, jadinya angka "3" padahal maunya "4"). Kalau bacaannya jelas
  // dekat pusat nada, aman langsung. Kalau posisinya di area pinggir/ambigu
  // antara dua nada tetangga, baru dikomit kalau bacaannya cukup meyakinkan --
  // makin dekat batas kategori berbeda, makin tinggi juga syarat keyakinannya.
  function isCategorySafe(freq, clarity){
    const midiOffset = freqToMidi(freq) - BASE_MIDI;
    const idx = Math.round(midiOffset);
    if(idx<0 || idx>=NOTE_COUNT) return {safe:false, idx};
    const centsOff = Math.abs(midiOffset - idx) * 100; // 0..50
    if(centsOff < 25) return {safe:true, idx};
    const neighborIdx = idx + (midiOffset >= idx ? 1 : -1);
    const differentCategory = !(neighborIdx>=0 && neighborIdx<NOTE_COUNT
        && categoryOfIndex(idx) === categoryOfIndex(neighborIdx));
    // Beda kategori (mis. angka/huruf) butuh keyakinan lebih tinggi lagi
    // daripada sekadar ketuker sesama angka, karena akibatnya lebih mengganggu.
    const requiredClarity = differentCategory ? 0.9 : 0.75;
    return { safe: clarity >= requiredClarity, idx };
  }

  function micLoop(){
    if(!listening) return;
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
    const rms = Math.sqrt(sum/buf.length);
    const now = performance.now();

    if(state==='idle'){
      if(rms>0.02 && rms>smoothedRms*1.6 && now>cooldownUntil){
        state='sampling';
        sampleTries=0;
        // Kasih jeda dikit dulu (~45ms) biar transien petikan gitar mereda dan
        // gelombangnya udah cukup stabil buat diukur.
        sampleAt = now + 45;
        showStatus('Mendengar petikan…');
      }
    } else if(state==='sampling'){
      if(now>=sampleAt){
        const result = yinDetect(buf, micCtx.sampleRate);
        sampleTries++;
        if(result){
          const chk = isCategorySafe(result.freq, result.clarity);
          if(chk.safe){
            // YIN jauh lebih tahan salah oktaf dibanding autokorelasi biasa, jadi
            // begitu dapat SATU bacaan yang meyakinkan langsung dikunci -- gak perlu
            // petik berkali-kali dulu baru kedeteksi. Ini yang bikin terasa instan
            // persis seperti tuner gitar sungguhan.
            commitDetectedNote(result.freq);
            state='releasing';
            cooldownUntil = now + COOLDOWN_MS;
            releaseWaitUntil = now + MAX_RELEASE_WAIT_MS;
          } else if(sampleTries < 4){
            // Bacaannya persis di batas dua kategori tuts berbeda (mis. angka vs
            // huruf/tanda baca) dan belum cukup yakin -- coba baca ulang dulu
            // daripada asal tebak dan salah kategori.
            sampleAt = now + 10;
          } else {
            showStatus('Nada di batas dua kategori tuts, coba petik lebih jelas.');
            state='releasing';
            cooldownUntil = now + COOLDOWN_MS;
            releaseWaitUntil = now + MAX_RELEASE_WAIT_MS;
          }
        } else if(sampleTries >= 4){
          // Beberapa frame berturut masih belum dapat bacaan yang jelas (mis. senar
          // teredam atau lebih dari satu senar berbunyi) -- baru di sini nyerah.
          showStatus('Nada belum terdeteksi jelas, coba petik lagi.');
          state='releasing';
          cooldownUntil = now + COOLDOWN_MS;
          releaseWaitUntil = now + MAX_RELEASE_WAIT_MS;
        } else {
          sampleAt = now + 10; // masih terlalu transien -- coba baca lagi di frame berikutnya
        }
      }
    } else if(state==='releasing'){
      // Baru boleh siap deteksi onset baru lagi kalau: jeda minimum sudah lewat
      // DAN (dengungannya sudah mereda di bawah RELEASE_RMS ATAU sudah kelamaan
      // nunggu / MAX_RELEASE_WAIT_MS lewat, sebagai jaring pengaman).
      if(now>cooldownUntil && (rms<RELEASE_RMS || now>releaseWaitUntil)){
        state='idle';
      }
    }
    smoothedRms = smoothedRms*0.85 + rms*0.15;
    rafId = requestAnimationFrame(micLoop);
  }

  async function startMic(){
    if(hasNativeMicBridge()){
      const ok = window.AndroidKeyboard.startNativeMic();
      if(ok){
        listening = true;
        micToolBtn.classList.add('on');
      }
      return;
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showStatus('❌ navigator.mediaDevices tidak tersedia. Kamu tetap bisa ketuk tuts manual.');
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
    }catch(err){
      const detail = (err && err.name) ? (err.name + (err.message ? ': ' + err.message : '')) : String(err);
      showStatus('❌ Gagal akses mikrofon → ' + detail + '. Kamu tetap bisa ketuk tuts manual.');
      return;
    }
    micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(stream);
    analyser = micCtx.createAnalyser();
    analyser.fftSize = 4096;
    src.connect(analyser);
    listening = true;
    document.getElementById('micToolBtn').classList.add('on');
    showStatus('Mendengarkan… petik satu nada per satu.');
    micLoop();
  }
  function stopMic(){
    listening=false;
    if(hasNativeMicBridge()){
      window.AndroidKeyboard.stopNativeMic();
    }
    if(rafId) cancelAnimationFrame(rafId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(micCtx) micCtx.close();
    document.getElementById('micToolBtn').classList.remove('on');
    showStatus('Mikrofon dijeda. Ketuk ikon mic untuk mendengarkan lagi.');
  }
  const micToolBtn = document.getElementById('micToolBtn');
  micToolBtn.addEventListener('click', ()=>{ if(listening) stopMic(); else startMic(); });

  window.addEventListener('keydown', (e)=>{
    const key = keyMap[e.key.toLowerCase()];
    if(!key) return;
    e.preventDefault();
    if(key.dataset.type==='note') manualPress(key);
    else if(key.id==='shiftBtn') shiftToggle(key);
    else functionalPress(key);
  });

  const kbWrap = document.getElementById('kbWrap');

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  // ---------------- Inisialisasi & wiring fitur baru ----------------
  loadSavedTheme();
  loadSavedFontScale();
  loadSavedKeyBorder();
  renderSuggestions();
  renderClipboardPanel();

  const keyBorderToggle = document.getElementById('keyBorderToggle');
  if(keyBorderToggle){
    keyBorderToggle.addEventListener('change', (e)=> applyKeyBorder(e.target.checked));
  }

  const fontScaleRange = document.getElementById('fontScaleRange');
  if(fontScaleRange){
    fontScaleRange.addEventListener('input', (e)=> applyFontScale(parseInt(e.target.value, 10)));
  }

  // ---------------- Toolbar fitur: tinggi ~10–12% dari total tinggi keyboard,
  // sesuai rasio Gboard asli. Dihitung ulang tiap kali ukuran kbWrap berubah
  // (rotasi layar, buka/tutup panel emoji, dsb) supaya rasionya tetap konsisten. ----------------
  function sizeToolbarToRatio(){
    const wrap = document.getElementById('kbWrap');
    const toolbar = document.getElementById('gboardToolbar');
    if(!wrap || !toolbar) return;
    const totalH = wrap.getBoundingClientRect().height;
    if(totalH <= 0) return;
    const target = Math.max(44, Math.min(56, totalH * 0.11)); // ~11% dari tinggi total, dibatasi 44–56px
    toolbar.style.setProperty('--toolbar-h', target + 'px');
    toolbar.style.minHeight = target + 'px';
  }
  if('ResizeObserver' in window){
    new ResizeObserver(sizeToolbarToRatio).observe(kbWrap);
  } else {
    window.addEventListener('resize', sizeToolbarToRatio);
  }
  sizeToolbarToRatio();

  document.getElementById('themeSwatches').addEventListener('pointerdown', (e)=>{
    const sw = e.target.closest('.theme-swatch');
    if(sw) applyTheme(sw.dataset.theme);
  });

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const clipboardBtn = document.getElementById('clipboardBtn');
  const clipboardPanel = document.getElementById('clipboardPanel');
  const gifBtn = document.getElementById('gifBtn');
  const gifPanel = document.getElementById('gifPanel');
  const translateBtn = document.getElementById('translateBtn');
  const translatePanel = document.getElementById('translatePanel');
  const keyboardInner = document.getElementById('keyboardInner');

  function closeAllPanels(){
    settingsPanel.style.display = 'none';
    clipboardPanel.style.display = 'none';
    gifPanel.style.display = 'none';
    translatePanel.style.display = 'none';
    keyboardInner.style.display = '';
    [clipboardBtn, gifBtn, translateBtn, settingsBtn].forEach(b=>b.classList.remove('tool-active'));
  }
  settingsBtn.addEventListener('click', ()=>{
    const willOpen = settingsPanel.style.display !== 'block';
    closeAllPanels();
    if(willOpen){ settingsPanel.style.display = 'block'; keyboardInner.style.display = 'none'; settingsBtn.classList.add('tool-active'); }
  });
  clipboardBtn.addEventListener('click', ()=>{
    const willOpen = clipboardPanel.style.display !== 'flex';
    closeAllPanels();
    if(willOpen){
      renderClipboardPanel();
      clipboardPanel.style.display = 'flex';
      keyboardInner.style.display = 'none';
      clipboardBtn.classList.add('tool-active');
    }
  });
  gifBtn.addEventListener('click', ()=>{
    const willOpen = gifPanel.style.display !== 'flex';
    closeAllPanels();
    if(willOpen){
      renderGifPanel();
      gifPanel.style.display = 'flex';
      keyboardInner.style.display = 'none';
      gifBtn.classList.add('tool-active');
    }
  });
  translateBtn.addEventListener('click', ()=>{
    const willOpen = translatePanel.style.display !== 'flex';
    closeAllPanels();
    if(willOpen){
      // Mode terjemah tetap menampilkan tuts di bawah (bukan cuma panel) supaya
      // user bisa langsung ngetik/petik nada, hasilnya muncul live di preview.
      translatePanel.style.display = 'flex';
      keyboardInner.style.display = '';
      translateBtn.classList.add('tool-active');
      updateTranslatePreview();
    }
  });
  document.getElementById('translateSwap').addEventListener('click', ()=>{
    const from = document.getElementById('translateFrom');
    const to = document.getElementById('translateTo');
    const tmp = from.value; from.value = to.value; to.value = tmp;
    updateTranslatePreview();
  });
  document.getElementById('translateFrom').addEventListener('change', updateTranslatePreview);
  document.getElementById('translateTo').addEventListener('change', updateTranslatePreview);
  document.getElementById('translateInsert').addEventListener('click', ()=>{
    const from = document.getElementById('translateFrom').value;
    const to = document.getElementById('translateTo').value;
    if(!text.trim()) return;
    const result = translateText(text, from, to);
    bridgeCommit(' → ' + result);
    text = text + ' → ' + result;
    cursorPos = text.length;
    showStatus('Terjemahan disisipkan.');
  });

  document.getElementById('oneHandBtn').addEventListener('click', toggleOneHand);
  document.getElementById('oneHandFlip').addEventListener('click', toggleOneHand);

  // ---------------- Mic langsung otomatis mendengarkan, tanpa perlu tombol ----------------
  // Di keyboard Android asli, izin mikrofon SUDAH dikabulkan sekali lewat
  // MainActivity saat aplikasi pertama dibuka — jadi getUserMedia() di sini
  // tidak akan memunculkan pop-up apa pun, dan mic langsung aktif diam-diam
  // begitu keyboard muncul. (Kalau dibuka di browser biasa untuk uji coba,
  // browser tetap akan menampilkan pop-up izin sekali, karena itu aturan
  // keamanan bawaan browser yang tidak bisa dilewati dari sisi halaman web.)
  startMic();
})();
</script>
</body>
</html>
