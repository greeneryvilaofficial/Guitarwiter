<!DOCTYPE html>
<html lang="id">
<head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

  :root{
    --app-bg:#F1F3F4;
    --frame:#1F2023;
    --screen:#FFFFFF;
    --field-bg:#FFFFFF;
    --field-border:#DADCE0;
    --kb-bg:#202124;
    --key-bg:#35363A;
    --key-fn-bg:#28292C;
    --key-text:#E8EAED;
    --key-tag:#7CE7C4;
    --shadow:rgba(0,0,0,.45);
    --accent:#1A73E8;
    --accent-dim:#E8F0FE;
    --danger:#D93025;
    --muted:#5F6368;
    --key-shift-on-bg:#284666;
    --key-capslock-bg:#1A73E8;
    --key-active-bg:#2E5D4D;
    --key-fn-active-bg:#3A4A57;
    --key-bubble-bg:#101114;
    --key-bubble-text:#FFFFFF;
    --key-enter-bg:#1CC9A5;
  }
  /* ---- Tema alternatif ala Gboard: tinggal ganti class di <body> ---- */
  body.theme-light{
    --kb-bg:#E8EAED; --key-bg:#FFFFFF; --key-fn-bg:#DADCE0; --key-text:#202124;
    --key-tag:#1A73E8; --key-active-bg:#C2E7FF; --key-fn-active-bg:#BDC1C6;
    --key-bubble-bg:#202124; --key-bubble-text:#FFFFFF; --key-enter-bg:#1A73E8;
  }
  body.theme-blue{
    --kb-bg:#0B2545; --key-bg:#13315C; --key-fn-bg:#0E223F; --key-text:#E8F0FE;
    --key-tag:#8AB4F8; --key-active-bg:#1A4A8A; --key-fn-active-bg:#1A4A8A;
    --key-bubble-bg:#08182E; --key-bubble-text:#FFFFFF; --key-enter-bg:#4C8DFF;
  }
  body.theme-purple{
    --kb-bg:#241B2F; --key-bg:#3A2C4A; --key-fn-bg:#2B2038; --key-text:#F1E8FA;
    --key-tag:#D9B3FF; --key-active-bg:#5B3E75; --key-fn-active-bg:#4A3560;
    --key-bubble-bg:#1A1220; --key-bubble-text:#FFFFFF; --key-enter-bg:#B388FF;
  }
  body.theme-green{
    --kb-bg:#0F2A1E; --key-bg:#17402C; --key-fn-bg:#0F2A1E; --key-text:#E4F5EA;
    --key-tag:#7CE7C4; --key-active-bg:#1F6B47; --key-fn-active-bg:#1B5A3D;
    --key-bubble-bg:#081A11; --key-bubble-text:#FFFFFF; --key-enter-bg:#2ECC8F;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    background:var(--kb-bg);
    font-family:'Roboto', sans-serif;
    color:var(--key-text);
    overflow-x:hidden;
  }

  /* Halaman ini murni tampilan keyboard saja (tanpa contoh kotak teks /
     judul aplikasi) — dibuat supaya saat dimuat sebagai keyboard sungguhan
     lewat HtmlKeyboardService.java, yang tampil cuma keyboard-nya, mengisi
     penuh area yang diberikan Android untuk keyboard. */
  .kb-float-wrap{
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:var(--kb-bg);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }

  /* ---- Responsif: layar sangat sempit / lebih lebar (tablet) ---- */
  @media (max-width:340px){
    .krow{ gap:3px; margin-bottom:4px; }
    .key{ padding:7px 0 5px; }
    .key .ch{ font-size:.9rem; }
  }
  @media (min-width:600px){
    .kb-float-wrap{ max-width:600px; }
    .key .ch{ font-size:1.15rem; }
  }

  .gboard-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px 2px; gap:4px;
  }
  .gtool-btn{
    border:none; background:none; color:#9AA0A6; font-size:1.05rem;
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent; flex:0 0 auto;
  }
  .gtool-btn:active{ background:rgba(255,255,255,.08); }
  .gtool-btn.mic-tool{ color:#8AB4F8; }
  .gtool-btn.mic-tool.on{ color:#F28B82; }
  .gtool-spacer{ flex:1; }

  .keyboard{ background:var(--kb-bg); border-radius:14px 14px 0 0; margin-top:0; padding:4px 4px 6px; }
  .krow{ display:flex; gap:5px; justify-content:center; margin-bottom:5px; }
  .krow:last-child{ margin-bottom:0; }

  .key{
    position:relative; flex:1; background:var(--key-bg); border:none; border-radius:6px;
    padding:9px 0 6px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 1.5px 0 var(--shadow); font-family:'Roboto', sans-serif;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .key .ch{ font-size:1rem; font-weight:400; color:var(--key-text); line-height:1; }
  .key .tag{ font-size:.48rem; font-weight:700; color:var(--key-tag); margin-top:2px; }
  .key.fn{ background:var(--key-fn-bg); flex:1.3; }
  .key.fn .ch{ font-size:.85rem; color:#C6C9CD; }
  .key.fn.key-shift{ flex:1.9; }
  .key.fn.key-shift .ch{ font-size:1.05rem; }
  .key.space{ flex:7; padding-top:12px; padding-bottom:9px; }
  .key.space .ch{ font-size:.66rem; color:#C6C9CD; font-weight:500; letter-spacing:.04em; }
  .key.is-active{ background:var(--key-active-bg); }
  .key.fn.is-active{ background:var(--key-fn-active-bg); }
  .key.shift-on{ background:var(--key-shift-on-bg); }
  .key.caps-lock{ background:var(--key-capslock-bg); }
  .key.caps-lock .ch{ color:#fff; }
  .key.fn.key-enter{ background:var(--key-enter-bg); flex:1.6; }
  .key.fn.key-enter .ch{ color:#062B22; font-size:1.05rem; }
  .key.fn.key-enter .tag{ color:#0B3B30; }
  .key.fn.key-enter.is-active{ background:#17AE8D; }

  .emoji-panel{
    display:none;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    background:var(--kb-bg);
    border-radius:14px;
    margin-top:12px;
    padding:10px 6px;
    max-height:230px;
    overflow-y:auto;
  }
  .emoji-btn{
    position:relative; border:none; background:var(--key-bg); border-radius:8px;
    padding:7px 0 5px; cursor:pointer; box-shadow:0 1.5px 0 var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .emoji-btn .ch{ font-size:1.1rem; line-height:1; }
  .emoji-btn .tag{ font-size:.42rem; font-weight:700; color:var(--key-tag); }
  .keyboard, .emoji-panel{ contain: layout style paint; }
  .key, .emoji-btn{ touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .emoji-btn.is-active{ background:var(--key-active-bg); }
  .emoji-back-btn{ background:var(--key-active-bg); font-weight:700; }

  /* ---- Suggestion bar (prediksi kata) ---- */
  .suggest-bar{
    display:flex; gap:4px; padding:6px 8px; background:var(--kb-bg);
    border-bottom:1px solid rgba(255,255,255,.06); min-height:34px;
  }
  .suggest-chip{
    flex:1; background:none; border:none; color:var(--key-text);
    font-family:inherit; font-size:.85rem; padding:6px 4px; border-radius:6px;
    text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .suggest-chip:active{ background:rgba(255,255,255,.1); }
  .suggest-chip.is-word{ font-weight:700; }
  .ime-status{
    display:none; padding:6px 10px; font-size:.78rem; text-align:center;
    background:#B3261E; color:#FFFFFF; font-family:'Roboto', sans-serif;
  }
  .ime-status.show{ display:block; }
  .ime-status.ok{ background:#1F6B47; }

  /* ---- Panel Settings (tema) ---- */
  .settings-panel{
    display:none; padding:14px 12px; background:var(--kb-bg); color:var(--key-text);
    font-family:'Roboto', sans-serif;
  }
  .settings-panel h4{ margin:0 0 10px; font-size:.85rem; color:var(--key-tag); }
  .theme-swatches{ display:flex; gap:12px; flex-wrap:wrap; }
  .theme-swatch{
    width:44px; height:44px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1rem;
  }
  .theme-swatch.selected{ border-color:var(--key-tag); }
  .theme-swatch[data-theme="dark"]{ background:#202124; }
  .theme-swatch[data-theme="light"]{ background:#FFFFFF; }
  .theme-swatch[data-theme="blue"]{ background:#13315C; }
  .theme-swatch[data-theme="purple"]{ background:#3A2C4A; }
  .theme-swatch[data-theme="green"]{ background:#17402C; }

  /* ---- Panel Clipboard ---- */
  .clipboard-panel{
    display:none; flex-direction:column; gap:6px; padding:8px;
    background:var(--kb-bg); max-height:260px; overflow-y:auto;
  }
  .clipboard-item{
    background:var(--key-bg); color:var(--key-text); border:none; border-radius:8px;
    padding:10px 12px; text-align:left; font-family:inherit; font-size:.85rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .clipboard-item:active{ background:var(--key-active-bg); }
  .clipboard-empty{ color:var(--muted); font-size:.8rem; padding:10px 4px; }

  /* ---- Mode satu tangan ---- */
  .kb-float-wrap.one-left .keyboard-inner,
  .kb-float-wrap.one-right .keyboard-inner{ transform-origin:bottom left; transform:scale(.78); }
  .kb-float-wrap.one-right .keyboard-inner{ transform-origin:bottom right; margin-left:auto; }
  .one-hand-flip{
    display:none; position:absolute; bottom:8px; width:40px; height:40px; border-radius:50%;
    background:var(--key-fn-bg); color:var(--key-text); border:none; font-size:1.1rem;
  }
  .kb-float-wrap.one-left .one-hand-flip{ display:block; right:6px; }
  .kb-float-wrap.one-right .one-hand-flip{ display:block; left:6px; }

  .key .bubble, .emoji-btn .bubble{
    position:absolute; bottom:100%; left:50%;
    transform:translateX(-50%) translateY(6px) scale(.85);
    background:var(--key-bubble-bg); color:var(--key-bubble-text); font-weight:700; font-size:1.1rem;
    padding:8px 12px; border-radius:8px; box-shadow:0 6px 16px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; white-space:nowrap;
    transition:opacity .1s ease, transform .1s ease; z-index:5;
  }
  .key .bubble.show, .emoji-btn .bubble.show{ opacity:1; transform:translateX(-50%) translateY(-4px) scale(1); }


</style>
</head>
<body>

<div class="kb-float-wrap" id="kbWrap">
  <div class="gboard-toolbar" id="gboardToolbar">
    <button class="gtool-btn" id="clipboardBtn" type="button" title="Clipboard">📋</button>
    <button class="gtool-btn" id="oneHandBtn" type="button" title="Mode satu tangan">✋</button>
    <div class="gtool-spacer"></div>
    <button class="gtool-btn" id="settingsBtn" type="button" title="Setelan">⚙</button>
    <button class="gtool-btn mic-tool" id="micToolBtn" type="button" title="Dengarkan gitar (otomatis aktif)">🎤</button>
  </div>
  <div class="suggest-bar" id="suggestBar"></div>
  <div class="ime-status" id="imeStatus"></div>
  <div class="settings-panel" id="settingsPanel">
    <h4>Pilih Tema Warna</h4>
    <div class="theme-swatches" id="themeSwatches">
      <div class="theme-swatch" data-theme="dark" title="Gelap"></div>
      <div class="theme-swatch" data-theme="light" title="Terang">🔆</div>
      <div class="theme-swatch" data-theme="blue" title="Biru"></div>
      <div class="theme-swatch" data-theme="purple" title="Ungu"></div>
      <div class="theme-swatch" data-theme="green" title="Hijau"></div>
    </div>
  </div>
  <div class="clipboard-panel" id="clipboardPanel"></div>
  <div class="keyboard-inner" id="keyboardInner">
    <div class="keyboard" id="keyboard"></div>
    <div class="emoji-panel" id="emojiPanel"></div>
  </div>
  <button class="one-hand-flip" id="oneHandFlip" type="button" title="Pindah sisi">⇄</button>
</div>

<script>
(function(){
  // ---------------- Note table: E2 (open low E) upward. Setiap tuts — termasuk spasi, Shift,
  // Backspace, Enter, dan tombol ganti mode — mendapat satu nada sendiri, berurutan dari nada
  // terendah (pojok kiri atas) ke nada tertinggi (pojok kanan bawah), mengikuti urutan visual keyboard. ----------------
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const BASE_MIDI = 40; // E2

  // Urutan visual keyboard (persis urutan render): baris angka, baris q-p, baris a-l,
  // [Shift] + baris z-m + [Backspace], lalu baris bawah [emoji][?123][,][spasi][.][Enter]
  const KEY_DEFS = [
    ...['1','2','3','4','5','6','7','8','9','0'].map(ch=>({type:'letter', char:ch})),
    ...['q','w','e','r','t','y','u','i','o','p'].map(ch=>({type:'letter', char:ch})),
    ...['a','s','d','f','g','h','j','k','l'].map(ch=>({type:'letter', char:ch})),
    {type:'shift'},
    ...['z','x','c','v','b','n','m'].map(ch=>({type:'letter', char:ch})),
    {type:'backspace'},
    {type:'emoji-toggle'},
    {type:'num-toggle'},
    {type:'literal', char:',', label:','},
    {type:'literal', char:' ', label:'spasi', big:true},
    {type:'literal', char:'.', label:'.'},
    {type:'enter'},
  ];
  const NOTE_COUNT = KEY_DEFS.length; // 44

  // Rentang index (di KEY_DEFS / NOTES) tuts huruf yang boleh diganti jadi simbol / huruf besar
  const LETTER_INDICES = [
    ...Array.from({length:10},(_,i)=>10+i), // baris q-p
    ...Array.from({length:9},(_,i)=>20+i),  // baris a-l
    ...Array.from({length:7},(_,i)=>30+i),  // baris z-m
  ];

  // Standard guitar tuning (open string MIDI numbers), string 6 = low E to string 1 = high e
  const TUNING = [
    {string:6, open:'E', midi:40},
    {string:5, open:'A', midi:45},
    {string:4, open:'D', midi:50},
    {string:3, open:'G', midi:55},
    {string:2, open:'B', midi:59},
    {string:1, open:'e', midi:64},
  ];
  const MAX_FRET = 20;
  function findFret(midi){
    let best = null;
    TUNING.forEach(t=>{
      const fret = midi - t.midi;
      if(fret>=0 && fret<=MAX_FRET){
        if(!best || fret<best.fret) best = {string:t.string, open:t.open, fret};
      }
    });
    return best;
  }

  const NOTES = [];
  for(let i=0;i<NOTE_COUNT;i++){
    const midi = BASE_MIDI + i;
    const freq = 440 * Math.pow(2, (midi-69)/12);
    const name = NOTE_NAMES[((midi%12)+12)%12] + (Math.floor(midi/12)-1);
    const pos = findFret(midi);
    NOTES.push({
      idx: i, midi, freq, name,
      string: pos ? pos.string : null,
      fret: pos ? pos.fret : null
    });
  }

  // ---------------- Keyboard layout: SEMUA tuts (44) responsif nada ----------------
  const keyboardEl = document.getElementById('keyboard');
  const keyMap = {};      // char fisik -> element (huruf/angka/koma/spasi/titik)
  const allKeys = [];     // index 0..43 -> element, sejajar dengan NOTES

  function makeKeyEl(def, note){
    const btn = document.createElement('button');
    btn.dataset.freq = note.freq;
    btn.dataset.note = note.name;
    btn.dataset.string = note.string;
    btn.dataset.fret = note.fret;
    btn.title = note.name;

    if(def.type==='letter'){
      btn.className='key';
      btn.dataset.type='note';
      btn.dataset.origChar = def.char;
      btn.innerHTML = '<span class="ch">'+def.char+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> manualPress(btn));
      keyMap[def.char] = btn;
    } else if(def.type==='shift'){
      btn.className='key fn key-shift';
      btn.id='shiftBtn';
      btn.innerHTML='<span class="ch">⇧</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> shiftToggle(btn));
    } else if(def.type==='backspace'){
      btn.className='key fn';
      btn.dataset.type='backspace';
      btn.innerHTML='<span class="ch">⌫</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn));
    } else if(def.type==='emoji-toggle'){
      btn.className='key fn'; btn.id='emojiBtn';
      btn.innerHTML='<span class="ch">😊</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=>{ flash(btn); setMode(mode==='emoji' ? 'letters' : 'emoji'); });
    } else if(def.type==='num-toggle'){
      btn.className='key fn'; btn.id='numBtn';
      btn.innerHTML='<span class="ch">?123</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=>{ flash(btn); setMode(mode==='symbols' ? 'letters' : 'symbols'); });
    } else if(def.type==='literal'){
      btn.className = def.big ? 'key space' : 'key';
      btn.dataset.type='literal';
      btn.dataset.char = def.char;
      btn.innerHTML = '<span class="ch">'+(def.label||def.char)+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn));
      keyMap[def.char] = btn;
    } else if(def.type==='enter'){
      btn.className='key fn key-enter';
      btn.dataset.type='enter';
      btn.innerHTML='<span class="ch">↵</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn));
    }
    return btn;
  }

  function buildRow(defs, notes){
    const row = document.createElement('div');
    row.className = 'krow';
    defs.forEach((def, i)=>{
      const note = notes[i];
      const el = makeKeyEl(def, note);
      row.appendChild(el);
      allKeys[note.idx] = el;
    });
    keyboardEl.appendChild(row);
  }

  buildRow(KEY_DEFS.slice(0,10),  NOTES.slice(0,10));   // angka
  buildRow(KEY_DEFS.slice(10,20), NOTES.slice(10,20));  // q-p
  buildRow(KEY_DEFS.slice(20,29), NOTES.slice(20,29));  // a-l
  buildRow(KEY_DEFS.slice(29,38), NOTES.slice(29,38));  // Shift + z-m + Backspace
  buildRow(KEY_DEFS.slice(38,44), NOTES.slice(38,44));  // emoji, ?123, , spasi . Enter

  // ---------------- Pelacak teks internal ----------------
  // Halaman ini sekarang murni tampilan keyboard (tidak ada kotak teks
  // visual). Variabel `text`/`cursorPos` di bawah TETAP dipertahankan
  // secara internal (tanpa dirender ke layar) karena masih dipakai untuk
  // fitur prediksi kata (lihat getCurrentWordRange) dan untuk menghitung
  // berapa karakter yang perlu dihapus saat kata diganti lewat saran.
  let text = '';
  let cursorPos = 0;

  // ---------------- Jembatan ke Android InputMethodService ----------------
  // Jika halaman ini dimuat di dalam HtmlKeyboardService.java (lewat addJavascriptInterface),
  // window.AndroidKeyboard akan otomatis tersedia dan setiap ketikan diteruskan
  // ke InputConnection kolom teks yang sedang aktif (WhatsApp, Instagram, dll).
  // Kalau dibuka di browser biasa untuk uji coba, bridge ini tidak ada sehingga
  // keyboard tetap berfungsi normal memakai kotak teks internal di atas.
  function hasAndroidBridge(){
    return !!(window.AndroidKeyboard && window.AndroidKeyboard.commitText);
  }
  function bridgeCommit(str){
    if(hasAndroidBridge()){
      try{ window.AndroidKeyboard.commitText(str); }catch(e){}
    }
  }
  function bridgeDeleteBackward(){
    if(window.AndroidKeyboard && window.AndroidKeyboard.deleteBackward){
      try{ window.AndroidKeyboard.deleteBackward(); }catch(e){}
    }
  }
  function bridgeEnter(){
    if(window.AndroidKeyboard && window.AndroidKeyboard.sendEnter){
      try{ window.AndroidKeyboard.sendEnter(); return true; }catch(e){}
    }
    return false;
  }

  function appendText(str){
    text = text.slice(0,cursorPos) + str + text.slice(cursorPos);
    cursorPos += str.length;
    bridgeCommit(str);
    renderSuggestions();
  }
  function backspace(){
    if(cursorPos<=0) return;
    text = text.slice(0,cursorPos-1) + text.slice(cursorPos);
    cursorPos -= 1;
    bridgeDeleteBackward();
    renderSuggestions();
  }
  function pressEnter(){
    // Panggil sendEnter() dulu (bisa memicu tombol Kirim/Cari sesuai kolom aktif),
    // baru perbarui pelacak teks lokal secara terpisah agar tidak terkirim dobel.
    bridgeEnter();
    text = text.slice(0,cursorPos) + '\n' + text.slice(cursorPos);
    cursorPos += 1;
    renderSuggestions();
  }

  // ---------------- Bridge tambahan: hapus beberapa karakter sekaligus (dipakai saat ganti kata via prediksi) ----------------
  function bridgeDeleteBackwardN(n){
    if(window.AndroidKeyboard && window.AndroidKeyboard.deleteBackwardN){
      try{ window.AndroidKeyboard.deleteBackwardN(n); return; }catch(e){}

    // Fallback kalau bridge lama belum punya deleteBackwardN: panggil deleteBackward berkali-kali.

  function getCurrentWordRange(){
    let start = cursorPos;
    while(start>0 && !/[\s\n]/.test(text[start-1])) start--;
    return { start, end: cursorPos, word: text.slice(start, cursorPos) };
  }

  function renderSuggestions(){
    const bar = document.getElementById('suggestBar');
    bar.innerHTML = '';
    const { word } = getCurrentWordRange();
    let candidates = [];
    if(word.length > 0){
      const lower = word.toLowerCase();
      candidates = DICTIONARY.filter(w => w.startsWith(lower)).slice(0,3);
      // Tombol pertama selalu kata yang sedang diketik apa adanya, biar bisa "diterima" langsung.
      candidates = [word, ...candidates.filter(c => c.toLowerCase() !== lower)].slice(0,3);
    } else {
      candidates = ['Halo', 'Terima kasih', 'Oke'];
    }
    candidates.forEach((c, idx) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'suggest-chip' + (idx===0 && word.length>0 ? ' is-word' : '');
      chip.textContent = c;
      chip.addEventListener('pointerdown', () => applySuggestion(c));
      bar.appendChild(chip);
    });
  }

  function applySuggestion(chosen){
    const { start, end, word } = getCurrentWordRange();
    const removeCount = word.length;
    text = text.slice(0, start) + chosen + ' ' + text.slice(end);
    cursorPos = start + chosen.length + 1;
    if(removeCount > 0) bridgeDeleteBackwardN(removeCount);
    bridgeCommit(chosen + ' ');
    renderSuggestions();
  }

  function shiftToggle(el){
    flash(el);

      capsLock = !capsLock;

    } else {
      const base = el.dataset.origChar;
      ch = (shiftActive && /^[a-z]$/.test(base)) ? base.toUpperCase() : base;

  function functionalPress(el){
    flash(el);
    const type = el.dataset.type;
    if(type==='backspace'){ showBubble(el,'⌫'); backspace(); }
    else if(type==='enter'){ showBubble(el,'↵'); pressEnter(); }
    else if(type==='literal'){ const c = el.dataset.char; showBubble(el, c===' '?'␣':c); appendText(c); }

  function autoTypeNote(idx){
    if(mode==='emoji'){
      const el = emojiKeys[idx];
      if(!el) return null;
      flash(el);
      const emo = el.dataset.emoji;
      showBubble(el, emo);
      appendText(emo);
      return emo;
    }

    const el = allKeys[idx];
    if(!el) return null;
    const type = el.dataset.type;

    if(type==='note'){
      flash(el);
      const base = el.dataset.origChar;
      let ch;
      if(mode==='symbols' && el.dataset.symbolChar){
        ch = el.dataset.symbolChar;
      } else {
        ch = (shiftActive && /^[a-z]$/.test(base)) ? base.toUpperCase() : base;

      showBubble(el, ch);
      appendText(ch);
      if(mode!=='symbols' && shiftActive && !capsLock){ shiftActive=false; updateShiftVisual(); }

    } else if(type==='literal'){
      flash(el);
      const c = el.dataset.char;
      showBubble(el, c===' ' ? '␣' : c);
      appendText(c);
      return c;
    } else if(type==='backspace'){
      flash(el); showBubble(el,'⌫'); backspace();
      return '⌫';

      flash(el); showBubble(el,'↵'); pressEnter();
      return '\n';

      shiftToggle(el);
      showBubble(el, capsLock ? 'CAPS' : (shiftActive ? '⇧ ON' : '⇧'));

      setMode(mode==='symbols' ? 'letters' : 'symbols');
      showBubble(el, mode==='symbols' ? '?123' : 'ABC');
      return '?123';

  // kode web. Kalau window.AndroidKeyboard.startNativeMic tersedia (artinya berjalan di
  // dalam APK asli), pakai jalur ini: rekam + deteksi nada dilakukan di kode Java native
  // (lihat NativeMicPitchDetector.java), hasilnya langsung dikirim ke sini secara instan.

  // ---------------- Mic: monophonic pitch detection (autocorrelation) ----------------
  let listening=false, micCtx=null, analyser=null, stream=null, rafId=null;
  let state='idle', sampleAt=0, cooldownUntil=0, smoothedRms=0.001;

  function autoCorrelate(buf, sampleRate){
    const SIZE = buf.length;
    let rms=0;
    for(let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
    rms = Math.sqrt(rms/SIZE);
    if(rms < 0.012) return -1;

    let r1=0, r2=SIZE-1;
    const thres=0.2;
    for(let i=0;i<SIZE/2;i++){ if(Math.abs(buf[i])<thres){ r1=i; break; } }
    for(let i=1;i<SIZE/2;i++){ if(Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; } }
    const trimmed = buf.slice(r1, r2);
    const n = trimmed.length;
    if(n < 8) return -1;

    const c = new Float32Array(n);
    for(let lag=0; lag<n; lag++){
      let sum=0;
      for(let i=0; i<n-lag; i++) sum += trimmed[i]*trimmed[i+lag];
      c[lag]=sum;
    }
    let d=0;
    while(d<n-1 && c[d]>c[d+1]) d++;
    let maxVal=-1, maxPos=-1;
    for(let i=d;i<n;i++){
      if(c[i]>maxVal){ maxVal=c[i]; maxPos=i; }
    }
    if(maxPos<=0) return -1;
    let T0 = maxPos;
    const x1=c[T0-1]||0, x2=c[T0], x3=(T0+1<n)?c[T0+1]:0;
    const a=(x1+x3-2*x2)/2, b=(x3-x1)/2;
    if(a) T0 = T0 - b/(2*a);
    if(T0<=0) return -1;
    return sampleRate/T0;
  }

  function micLoop(){
    if(!listening) return;
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
    const rms = Math.sqrt(sum/buf.length);
    const now = performance.now();

    if(state==='idle'){
      if(rms>0.02 && rms>smoothedRms*1.6 && now>cooldownUntil){
        state='sampling';
        sampleAt = now + 45;
        showStatus('Mendengar petikan…');
      }
    } else if(state==='sampling'){
      if(now>=sampleAt){
        const freq = autoCorrelate(buf, micCtx.sampleRate);
        if(freq>0){
          const midi = 69 + 12*Math.log2(freq/440);
          const idx = Math.round(midi) - BASE_MIDI;
          if(idx>=0 && idx<NOTE_COUNT){
            const typed = autoTypeNote(idx);
            const noteName = NOTES[idx].name;
            const label = (typed===' ') ? '␣' : (typed==='\n' ? '↵' : typed);
            showStatus('Nada <b>'+noteName+'</b> ('+freq.toFixed(0)+' Hz) → <b>"'+label+'"</b>');
          } else {
            showStatus('Nada di luar jangkauan '+NOTES[0].name+'–'+NOTES[NOTE_COUNT-1].name+' ('+freq.toFixed(0)+' Hz).');
          }
        } else {
          showStatus('Nada belum terdeteksi jelas, coba petik lagi.');
        }
        state='idle';
        cooldownUntil = now + 260;
      }
    }
    smoothedRms = smoothedRms*0.85 + rms*0.15;
    rafId = requestAnimationFrame(micLoop);
  }

  async function startMic(){
    if(hasNativeMicBridge()){
      const ok = window.AndroidKeyboard.startNativeMic();
      if(ok){
        listening = true;
        micToolBtn.classList.add('on');
      }
      return;
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showStatus('❌ navigator.mediaDevices tidak tersedia. Kamu tetap bisa ketuk tuts manual.');
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
    }catch(err){
      const detail = (err && err.name) ? (err.name + (err.message ? ': ' + err.message : '')) : String(err);
      showStatus('❌ Gagal akses mikrofon → ' + detail + '. Kamu tetap bisa ketuk tuts manual.');
      return;
    }
    micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(stream);
    analyser = micCtx.createAnalyser();
    analyser.fftSize = 4096;
    src.connect(analyser);
    listening = true;
    document.getElementById('micToolBtn').classList.add('on');
    showStatus('Mendengarkan… petik satu nada per satu.');
    micLoop();
  }
  function stopMic(){
    listening=false;

      window.AndroidKeyboard.stopNativeMic();

    if(rafId) cancelAnimationFrame(rafId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(micCtx) micCtx.close();
    document.getElementById('micToolBtn').classList.remove('on');
    showStatus('Mikrofon dijeda. Ketuk ikon mic untuk mendengarkan lagi.');
  }

  }
  settingsBtn.addEventListener('click', ()=>{
    const willOpen = settingsPanel.style.display !== 'block';
    closeAllPanels();
    if(willOpen){ settingsPanel.style.display = 'block'; keyboardInner.style.display = 'none'; }
  });
  clipboardBtn.addEventListener('click', ()=>{
    const willOpen = clipboardPanel.style.display !== 'flex';
    closeAllPanels();
    if(willOpen){
      renderClipboardPanel();
      clipboardPanel.style.display = 'flex';
      keyboardInner.style.display = 'none';
    }
  });

  document.getElementById('oneHandBtn').addEventListener('click', toggleOneHand);
  document.getElementById('oneHandFlip').addEventListener('click', toggleOneHand);

  // ---------------- Mic langsung otomatis mendengarkan, tanpa perlu tombol ----------------
  // Di keyboard Android asli, izin mikrofon SUDAH dikabulkan sekali lewat
  // MainActivity saat aplikasi pertama dibuka — jadi getUserMedia() di sini
  // tidak akan memunculkan pop-up apa pun, dan mic langsung aktif diam-diam
  // begitu keyboard muncul. (Kalau dibuka di browser biasa untuk uji coba,
  // browser tetap akan menampilkan pop-up izin sekali, karena itu aturan
  // keamanan bawaan browser yang tidak bisa dilewati dari sisi halaman web.)
  startMic();
})();
</script>
</body>
</html>
